  const escape = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  function fields(item) {
    return [
      {label:'공식 이름', text:`${item.number} ${item.title} ${item.scope}`},
      {label:'공식', text:item.formula.join(' / ')},
      ...item.terms.map(([term, description]) => ({label:`용어 · ${term}`, text:`${term}: ${description}`})),
      {label:'기출 정보', text:item.refs.map(ref => `${ref.year}년 제${ref.round}회 2차 과목 ${ref.subject} ${ref.originalNumber}번 ${ref.topic}`).join(' / ')},
      {label:'기출 적용 예시', text:item.example.steps.join(' ')},
      {label:'적용 전제', text:item.example.note || ''},
      {label:'주의점', text:item.notes.join(' ')},
    ];
  }
  function makeIndex(items) {
    return items.map(item => ({item, fields:fields(item).map(field => ({...field, normalized:compact(field.text)}))}));
  }
  function search(index, query) {
    const tokens = normalize(query).split(' ').filter(Boolean).map(compact);
    if (!tokens.length) return index.map(record => ({item:record.item, match:null}));
    return index.filter(record => {
      const combined = record.fields.map(field => field.normalized).join(' ');
      return tokens.every(token => combined.includes(token));
    }).map(record => ({item:record.item, match:record.fields.find(field => tokens.some(token => field.normalized.includes(token))) || null}));
  }
  function excerpt(text, query, maxLength=112) {
    const value = String(text);
    const tokens = normalize(query).split(' ').filter(Boolean);
    let position = -1;
    for (const token of tokens) {
      const found = normalize(value).indexOf(token);
      if (found >= 0 && (position < 0 || found < position)) position = found;
    }
    const start = Math.max(0, position - 24);
    const cut = value.slice(start, start + maxLength);
    return `${start ? '…' : ''}${cut}${start + maxLength < value.length ? '…' : ''}`;
  }
  function highlight(text, query) {
    const tokens = normalize(query).split(' ').filter(Boolean).sort((a,b)=>b.length-a.length);
    if (!tokens.length) return escape(text);
    const pattern = tokens.map(token=>token.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
    const regex = new RegExp(`(${pattern})`,'giu');
    return String(text).split(regex).map((part,i)=>i%2 ? `<mark>${escape(part)}</mark>` : escape(part)).join('');
  }
  function restore(raw, items) {
    let saved;
    try { saved = typeof raw === 'string' ? JSON.parse(raw) : raw; } catch { saved = null; }
    const valid = saved && typeof saved === 'object' && !Array.isArray(saved) ? saved : {};
    const id = typeof valid.id === 'string' && items.some(item=>item.id===valid.id) ? valid.id : null;
    return {
      view:valid.view==='detail' && id ? 'detail' : 'list', id,
      query:typeof valid.query==='string' ? valid.query.slice(0,160) : '',
      listY:Number.isFinite(valid.listY) ? Math.max(0, Math.min(valid.listY, 1000000)) : 0,
      detailY:Number.isFinite(valid.detailY) ? Math.max(0, Math.min(valid.detailY, 1000000)) : 0,
      expanded:valid.expanded===true && !!id,
    };
  }
  function newDetail(state,id) {
    return {...state,view:'detail',id,expanded:false,detailY:0};
  }
  return {normalize,compact,escape,makeIndex,search,excerpt,highlight,restore,newDetail};
});
</script>
<script>(() => {
  'use strict';
  const C = FormulaCore;
  const data = JSON.parse(document.getElementById('formula-data').textContent);
  const items = data.formulas;
  const byId = new Map(items.map(item => [item.id,item]));
  const index = C.makeIndex(items);
  const STORAGE_KEY = '손해평가사_2차_공식집_v1';
  const main = document.getElementById('main');
  const esc = C.escape;
  let storageWarning = false;
  let raw = null;
  try { raw = localStorage.getItem(STORAGE_KEY); } catch {}
  let state = C.restore(raw,items);
  let hasListHistory = false;
  let toastTimer;
  let scrollTimer;
  const firstHash = new URLSearchParams(location.hash.slice(1)).get('formula');
  if (firstHash && byId.has(firstHash) && (firstHash !== state.id || state.view!=='detail')) state = C.newDetail(state,firstHash);

  function notify(message) {
    const target = document.getElementById('notice');
    target.textContent = message;
    target.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{target.hidden=true;},5000);
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch {
      if (!storageWarning) {storageWarning=true;notify('현재 브라우저에서는 마지막 화면을 저장할 수 없습니다. 일반 Chrome 탭에서 이용해 주세요.');}
    }
  }
  function route(mode='replace') {
    const address = new URL(location.href);
    address.hash = state.view==='detail' ? new URLSearchParams({formula:state.id}).toString() : '';
    history[mode==='push' ? 'pushState' : 'replaceState']({formulaBook:true,view:state.view,id:state.id},'',address);
  }
  function results() {return C.search(index,state.query);}
  function capturePosition() {
    if (state.view==='list') state.listY=window.scrollY;
    else state.detailY=window.scrollY;
  }
  function moveScroll(y,focus=false) {
    requestAnimationFrame(()=>{
      window.scrollTo({top:y,behavior:'instant'});
      if (focus) main.focus({preventScroll:true});
    });
  }
  function sourceQuestion(ref) {
    return `과목 ${ref.subject} · ${ref.originalNumber}번${ref.appNumber!==ref.originalNumber ? ` (기출 앱 ${ref.appNumber}번)` : ''}`;
  }
  function bookInfo(item) {
    return `${item.legacy ? '현행 대조면' : '기준서'} 인쇄 ${item.printedPage}쪽 · PDF ${item.page}쪽`;
  }
  function listResults() {
    const found=results();
    const count=document.getElementById('result-count');
    count.innerHTML=`${state.query.trim() ? `검색 결과 ${found.length}개` : `전체 공식 ${items.length}개`}<span class="book-order">기준서 페이지 순</span>`;
    document.getElementById('clear-search').hidden=!state.query;
    const container=document.getElementById('results');
    if (!found.length) {
      container.innerHTML='<div class="empty"><strong>검색 결과가 없습니다</strong><p>짧은 용어나 다른 표현으로 찾아보세요.<br>예: 함수율, 자기부담, 낙엽률</p><button class="secondary" data-action="clear">검색어 지우기</button></div>';
      return;
    }
    container.innerHTML=`<ol class="formula-list">${found.map(({item,match})=>`<li><button type="button" class="formula-card" data-action="open" data-id="${esc(item.id)}" aria-label="공식 ${item.number}. ${esc(item.title)} 열기"><span class="formula-number" aria-hidden="true">${item.number}</span><span class="card-content"><span class="card-title">${C.highlight(item.title,state.query)}</span><span class="card-meta">${bookInfo(item)}</span>${item.legacy ? '<span class="legacy">과거 비교식</span>' : ''}${match ? `<span class="match-snippet"><span class="match-label">${esc(match.label)}</span>${C.highlight(C.excerpt(match.text,state.query),state.query)}</span>` : ''}</span><span class="card-chevron" aria-hidden="true">›</span></button></li>`).join('')}</ol>`;
  }
  function renderList({focusSearch=false,restoreY=true}={}) {
    document.title='손해평가사 2차 공식집';
    main.innerHTML=`<section class="hero"><span class="count">1~12회 기출 연계 · ${items.length}개 공식</span><p class="eyebrow">2026 기준서 순서</p><h1>공식부터 차근차근</h1><p>목록에서 공식을 선택하세요.<br>용어와 기출 풀이는 필요한 순간에 펼쳐볼 수 있습니다.</p></section><section class="search-area" aria-label="공식과 용어 검색"><label for="search-input">공식 · 용어 찾기</label><div class="search-box"><span class="search-symbol" aria-hidden="true">⌕</span><input type="search" id="search-input" maxlength="160" autocomplete="off" placeholder="예: 함수율, 낙엽률, 자기부담금" value="${esc(state.query)}" aria-describedby="search-help"><button class="clear-search" id="clear-search" data-action="clear" aria-label="검색어 지우기">×</button></div><p class="search-help" id="search-help">공식 이름, 용어 설명, 기출 정보와 예시를 함께 검색합니다.</p></section><p class="result-count" id="result-count" aria-live="polite" aria-atomic="true"></p><section id="results" aria-label="공식 목록"></section><footer class="list-footer">2026년 기준서 수정본(2026.3.31.)과 기존 2차 답안·해설을 정리했습니다.<br>기준서 쪽수는 인쇄 쪽수와 PDF 뷰어 쪽수를 함께 표시합니다.<br>버전 ${esc(data.version)} · 학습 화면은 이 기기에 저장됩니다.</footer>`;
    listResults();
    moveScroll(restoreY ? state.listY : 0);
    if (focusSearch) requestAnimationFrame(()=>document.getElementById('search-input').focus());
  }
  function explanation(item) {
    const e=item.example;
    return `<section aria-labelledby="terms-heading"><h2 id="terms-heading">용어 설명</h2><dl>${item.terms.map(([name,description])=>`<div class="term-row"><dt>${esc(name)}</dt><dd>${esc(description)}</dd></div>`).join('')}</dl></section><section aria-labelledby="refs-heading"><h2 id="refs-heading">사용·설명된 기출문제</h2><p class="intro">계산에 사용된 문항과 공식·용어·적용조건을 설명한 문항을 함께 연결했습니다.</p><ul class="reference-list">${item.refs.map(ref=>`<li><span class="ref-title">${ref.year}년 제${ref.round}회 2차 · ${sourceQuestion(ref)}</span><span class="ref-topic">${esc(ref.topic)}</span><span class="ref-pages">답안·해설 PDF ${esc(ref.answerPages)}쪽</span></li>`).join('')}</ul></section><section aria-labelledby="example-heading"><h2 id="example-heading">기출 적용 예시</h2><div class="example-box"><h3>${e.year}년 제${e.round}회 2차 · ${sourceQuestion(e)}</h3>${e.steps.map(step=>`<p>${esc(step)}</p>`).join('')}</div>${e.note ? `<p class="source-note"><strong>해설의 적용 전제</strong><br>${esc(e.note)}</p>` : ''}</section><section aria-labelledby="check-heading"><h2 id="check-heading">공식의 의미 · 오답 방지</h2><ul class="check-list">${item.notes.map(note=>`<li>${esc(note)}</li>`).join('')}</ul></section><section aria-labelledby="source-heading"><h2 id="source-heading">자료 기준</h2><div class="source-info">${esc(data.bookTitle)}<br>${bookInfo(item)}<br>공식집 PDF ${item.pdfPage}~${item.pdfPage+1}쪽${item.legacy ? '<br><strong>과거 비교식입니다.</strong> 기준서 쪽수는 대응하는 현행 설명의 대조 위치입니다.' : ''}<br>기출 예시 출처: ${esc(e.answerPdf)} ${esc(e.answerPages)}쪽</div></section>`;
  }
  function renderDetail({restoreY=false,focus=false}={}) {
    const item=byId.get(state.id);
    if (!item) {state.view='list';route();renderList();return;}
    const found=results().map(row=>row.item);
    const pool=found.some(x=>x.id===item.id) ? found : items;
    const position=pool.findIndex(x=>x.id===item.id);
    document.title=`공식 ${item.number}. ${item.title} · 2차 공식집`;
    main.innerHTML=`<nav class="detail-top" aria-label="학습 화면 이동"><button type="button" class="back-button" data-action="list">← 목록으로</button><button type="button" class="search-button" data-action="search">용어 검색 ⌕</button></nav><article><p class="eyebrow">공식 ${item.number} / ${items.length}</p><h1 class="detail-title">${esc(item.title)}</h1><p class="scope">${esc(item.scope)}</p><div class="book-ref"><span class="book-chip">기준서 인쇄 ${item.printedPage}쪽</span><span class="book-chip">PDF ${item.page}쪽${item.legacy ? ' · 현행 대조면' : ''}</span>${item.legacy ? '<span class="legacy">과거 비교식</span>' : ''}</div><section class="formula-box" aria-label="공식">${item.formula.map(line=>`<p>${esc(line)}</p>`).join('')}</section><button type="button" id="explain-toggle" class="explain-toggle" data-action="explain" aria-expanded="${state.expanded}" aria-controls="explanation"><span><span id="toggle-label">${state.expanded ? '추가 설명 접기' : '추가 설명 보기'}</span><span class="toggle-hint">용어 · 기출문제 · 적용 예시</span></span><span class="toggle-icon" id="toggle-icon" aria-hidden="true">${state.expanded ? '−' : '+'}</span></button><div class="explanation" id="explanation" ${state.expanded ? '' : 'hidden'}>${explanation(item)}</div></article><nav class="detail-footer" aria-label="다른 공식 학습"><button type="button" class="nav-button" data-action="previous" ${position===0 ? 'disabled' : ''}>← 이전 공식</button><button type="button" class="nav-button" data-action="next" ${position===pool.length-1 ? 'disabled' : ''}>다음 공식 →</button><span class="position">${state.query.trim() && pool===found ? `검색 결과 ${position+1} / ${pool.length}` : `기준서 순서 ${position+1} / ${pool.length}`}</span><button type="button" class="nav-button bottom-list" data-action="list">공식 목록으로 돌아가기</button></nav>`;
    moveScroll(restoreY ? state.detailY : 0,focus);
  }
  function openFormula(id) {
    if (!byId.has(id)) return;
    capturePosition();
    const fromList=state.view==='list';
    state=C.newDetail(state,id);
    route(fromList ? 'push' : 'replace');
    if (fromList) hasListHistory=true;
    save();renderDetail({focus:true});
  }
  function showList({focusSearch=false}={}) {
    capturePosition();
    if (hasListHistory && !focusSearch) {history.back();return;}
    // Search is a direct return; replace both the UI route and its state.
    state.view='list';state.expanded=false;state.detailY=0;
    route();hasListHistory=false;save();renderList({focusSearch});
  }
  function navigate(offset) {
    const found=results().map(row=>row.item);
    const pool=found.some(item=>item.id===state.id) ? found : items;
    const at=pool.findIndex(item=>item.id===state.id);
    const item=pool[at+offset];
    if (item) openFormula(item.id);
  }
  function clearSearch() {
    state.query='';state.listY=0;save();
    const input=document.getElementById('search-input');
    if (input) {input.value='';listResults();input.focus();}
  }
  main.addEventListener('input',event=>{
    if (event.target.id==='search-input') {
      state.query=event.target.value.slice(0,160);state.listY=0;save();listResults();
    }
  });
  main.addEventListener('click',event=>{
    const button=event.target.closest('button[data-action]');
    if (!button || button.disabled) return;
    switch (button.dataset.action) {
      case 'open':openFormula(button.dataset.id);break;
      case 'list':showList();break;
      case 'search':showList({focusSearch:true});break;
      case 'clear':clearSearch();break;
      case 'previous':navigate(-1);break;
      case 'next':navigate(1);break;
      case 'explain':
        state.expanded=!state.expanded;
        document.getElementById('explanation').hidden=!state.expanded;
        button.setAttribute('aria-expanded',String(state.expanded));
        document.getElementById('toggle-label').textContent=state.expanded ? '추가 설명 접기' : '추가 설명 보기';
        document.getElementById('toggle-icon').textContent=state.expanded ? '−' : '+';
        capturePosition();save();break;
    }
  });
  document.getElementById('home-link').addEventListener('click',event=>{event.preventDefault();if(state.view==='detail')showList();else moveScroll(0);});
  window.addEventListener('popstate',event=>{
    capturePosition();
    const target=event.state;
    if (target?.formulaBook && target.view==='detail' && byId.has(target.id)) {
      state=C.newDetail(state,target.id);renderDetail();
    } else {state.view='list';state.expanded=false;hasListHistory=false;renderList();}
    save();
  });
  window.addEventListener('scroll',()=>{
    clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{capturePosition();save();},140);
  },{passive:true});
  window.addEventListener('pagehide',()=>{capturePosition();save();});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){capturePosition();save();}});

  const offlineStatus=document.getElementById('offline-status');
  let offlineReady=false;
  function refreshConnection() {
    offlineStatus.textContent=location.protocol==='file:' ? '파일로 학습 중' : offlineReady ? (navigator.onLine ? '오프라인 준비 완료' : '오프라인 학습 중') : (navigator.onLine ? '오프라인 준비 중' : '인터넷 연결 없음');
  }
  window.addEventListener('online',refreshConnection);window.addEventListener('offline',refreshConnection);
  if ('serviceWorker' in navigator && ['https:','http:'].includes(location.protocol)) {
    navigator.serviceWorker.register(`./sw.js?v=${encodeURIComponent(data.version)}`).then(()=>navigator.serviceWorker.ready).then(()=>{offlineReady=true;refreshConnection();}).catch(()=>{offlineStatus.textContent='브라우저로 학습 중';});
  }
  let installPrompt=null;
  const installButton=document.getElementById('install-button');
  window.addEventListener('beforeinstallprompt',event=>{
    event.preventDefault();installPrompt=event;installButton.hidden=false;
  });
  installButton.addEventListener('click',async()=>{
    if (!installPrompt) return;
    installButton.disabled=true;
    try {await installPrompt.prompt();await installPrompt.userChoice;}
    catch {notify('Chrome 메뉴의 설치 항목을 이용해 주세요.');}
    installPrompt=null;installButton.hidden=true;installButton.disabled=false;
  });
  window.addEventListener('appinstalled',()=>{installButton.hidden=true;installPrompt=null;notify('공식집 앱이 설치되었습니다.');});
  route();
  if(state.view==='detail')renderDetail({restoreY:true});else renderList();
  refreshConnection();
})();
</script>
