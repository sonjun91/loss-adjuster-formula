:8,"appNumber":8,"topic":"사과 영업·부가·농가부담보험료","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10","steps":["순보험료 = 10,000,000 × 15% × 100% = 1,500,000원. 주어진 할인·할증 계수 100%는 추가 변동이 없는 1.0배이다.","부가보험료 = 10,000,000 × 2.5% × 100% = 250,000원. 영업보험료 = 1,500,000 + 250,000 = 1,750,000원."],"note":"기존 본문 750,000원은 맞았으나 뒤 정정표가 잘못 600,000원으로 바꾸었다. 정정표를 없애고 올바른 산식으로 통합했다."}},{"id":"gov_support","number":10,"title":"농작물 국고보조·농가부담 보험료","scope":"농작물 정부·지자체 지원","page":120,"printedPage":113,"pdfPage":27,"formula":["국고보조 = 순보험료 × 해당 국고보조율 + 부가보험료 지원액","농가부담 = 영업보험료 - 국고보조 - 지자체 지원","순보험료 부담분 = 순보험료 × (1 - 국고율 - 지자체율)"],"terms":[["국고보조율","품목과 자기부담비율 등에 따라 정한 국가 지원율입니다."],["지자체율","지방자치단체가 지원하는 비율입니다. 산정 분모를 확인합니다."],["농가부담","지원금을 뺀 계약자의 실제 부담보험료입니다."]],"legacy":false,"notes":["국고보조율은 품목·보장수준마다 다릅니다. 50%를 일괄 적용하지 않습니다.","부가보험료 전액 지원 조건이면 순보험료와 별도로 더합니다."],"refs":[{"year":2016,"round":2,"subject":1,"originalNumber":9,"appNumber":9,"topic":"벼 친환경보험료·옛 무사고환급","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2018,"round":4,"subject":1,"originalNumber":5,"appNumber":5,"topic":"대추 비가림시설 가입금액·보험료","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"7"},{"year":2021,"round":7,"subject":1,"originalNumber":8,"appNumber":8,"topic":"사과·옥수수·말 정부지원액","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2022,"round":8,"subject":1,"originalNumber":8,"appNumber":8,"topic":"사과 영업·부가·농가부담보험료","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2024,"round":10,"subject":1,"originalNumber":6,"appNumber":6,"topic":"떫은감 보험료 및 착과감소보험금","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"},{"year":2025,"round":11,"subject":1,"originalNumber":6,"appNumber":6,"topic":"벼의 평년수확량·보험금·정부보조","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"},{"year":2025,"round":11,"subject":1,"originalNumber":8,"appNumber":8,"topic 소보험금","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"},{"year":2024,"round":10,"subject":2,"originalNumber":20,"appNumber":20,"topic":"사과 다수 사고와 max A","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2026,"round":12,"subject":1,"originalNumber":10,"appNumber":10,"topic":"적과전 종합위험Ⅱ 사과","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"12"},{"year":2026,"round":12,"subject":2,"originalNumber":20,"appNumber":20,"topic":"사과 착과감소와 사고별 과실손해","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"22"}],"example":{"year":2024,"round":10,"subject":1,"originalNumber":6,"appNumber":6,"topic":"떫은감 보험료 및 착과감소보험금","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8","steps":["착과감소보험금 = (9,000 - 450 - 2,250) × 1,200 × 70% = 5,292,000원."],"note":"기존 보험료 두 값과 착과감소보험금 35,910,000원을 정정했다. 정부 보조율은 문제에 제시된 85% 보장수준의 38%를 적용했다."}},{"id":"fruit_pay","number":12,"title":"적과후 과실손해보험금","scope":"적과전종합위험 / 적과후 누적감수","page":123,"printedPage":116,"pdfPage":31,"formula":["과실손해보험금 = (누적감수량 - 과실손해 자기부담감수량) × 가입가격","개수 사용 시 = (누적감수과실수 - 자기부담감수과실수) × 가입과중 × 가입가격"],"terms":[["누적감수","보장재해별로 인정한 추가 손해를 중복 없이 합친 수량입니다."],["가입과중","가입 시 적용한 과실 1개당 중량입니다."],["가입가격","중량 1단위의 계약가격입니다."],["과실손해 자기부담","적과전 보상대상 감소분을 반영하여 조정한 남은 자기부담수량입니다."]],"legacy":false,"notes":["보험금 지급식과 누적감수÷기준착과수라는 참고 손해비율을 구분합니다.","남은 자기부담은 별도 조정식으로 구합니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":20,"appNumber":20,"topic":"단감 5종한정·과실·나무손해","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22~23"},{"year":2021,"round":7,"subject":2,"originalNumber":20,"appNumber":20,"topic":"배 착과감소·과실·나무손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2024,"round":10,"subject":2,"originalNumber":20,"appNumber":20,"topic":"사과 다수 사고와 max A","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2026,"round":12,"subject":2,"origina ."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":1,"appNumber":11,"topic":"사과 실제결과주수·나무손해보험금","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"13"},{"year":2017,"round":3,"subject":1,"originalNumber":4,"appNumber":4,"topic":"매실 나무손해보험금","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"6"},{"year":2019,"round":5,"subject":2,"originalNumber":20,"appNumber":20,"topic":"단감 5종한정·과실·나무손해","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22~23"},{"year":2021,"round":7,"subject":1,"originalNumber":10,"appNumber":10,"topic":"포도·나무 보험금과 비가림시설","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"12"},{"year":2021,"round":7,"subject":2,"originalNumber":20,"appNumber":20,"topic":"배 착과감소·과실·나무손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2024,"round":10,"subject":2,"originalNumber":18,"appNumber":18,"topic":"5종한정특약과 나무손해의 구별","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":20,"appNumber":20,"topic":"배 착과감소·과실·나무손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["나무 가입금액 = 750 × 100,000 = 75,000,000원. 나무피해율 = (30 + 30) ÷ 750 = 8%. 조수해는 나무손해특약의 종합위험으로 보장된다. 보험금 = 75,000,000 × (8% - 5%) = 2,250,000원."],"note":"해석 및 보완: 원문의 별도 사고당시 착과수는 없으므로 자연낙과 배제 조건과 앞선 낙과·고사 자료로 잔존과실 47,300개를 산출했다. 이는 명시한 조건부 학습 계산이며 공식 채점기준 확인값이 아니다. 기존 최종 값은 유지하고 A·자기부담·조수해 설명을 정정했다."}},{"id":"normal_fruit","number":15,"title":"평년착과량의 과거실적·기준표준 보정","scope":"적과전종합위험 / 과거 가입이력 있는 농지","page":127,"printedPage":120,"pdfPage":37,"formula":["평년착과량 = [A + (B - A) × (1 - Y ÷ 5)] × C ÷ D"],"terms":[["A","해당 과거 가입연도의 적과후착과량 평균입니다."],["B","해당 과거 가입연도의 표준수확량 평균입니다. 평년착과량 평균이 아닙니다."],["C","가입연도의 기준표준수확량입니다."],["D","해당 과거연도 기준표준수확량의 평균입니다."],["Y","산식에 반영하는 과거 가입연도 수입니다."]],"legacy":false,"notes":["평년수확량식의 A·B·C와 이름이 비슷해도 분모 D와 각 평균의 정의가 다릅니다.","사과 일반재배 기준표준수확량과 어린 수령 보정 조건을 확인합니다."],"refs":[{"year":2018,"round":4,"subject":1,"originalNumber":3,"appNumber":3,"topic":"평년착과량 산정","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"5"},{"year":2023,"round":9,"subject":1,"originalNumber":6,"appNumber":6,"topic":"사과 평년착과량·보험금·차액보험료","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"}],"example":{"year":2018,"round":4,"subject":1,"originalNumber":3,"appNumber":3,"topic":"평년착과량 산정","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"5","steps":["평년착과량 = [A + (B - A) × (1 - Y ÷ 5)] × C ÷ D = [6,400 + 2,000 × 0.4] × 9,350 ÷ 8,500 = 7,920개."],"note":"현행 적과전종합위험의 평년착과량 산식을 사용한다. 원문 단위가 개이므로 답도 개로 표시한다. 2021년 이후 실적에 적용되는 상·하한을 2014~2017년 자료에 소급하지 않는다."}},{"id":"rain_shelter","number":16,"title":"비가림시설 보험가입금액","scope":"포도·대추 등의 비가림시설","page":142,"printedPage":135,"pdfPage":39,"formula":["가입금액 산출액 = ㎡당 시설비 × 가입면적 × 선택비율"],"terms":[["㎡당 시설비","해당 시설의 평가 기준 단가입니다."],["가입면적","보장대상 시설의 면적입니다."],["선택비율","현행 기본서의 80~130% 범위에서 10% 단위로 고르는 비율입니다."]],"legacy":false,"notes":["최소·최대 금액은 각각 80%·130%를 넣고 상품별 금액처리를 합니다.","과거 문제의 시설단가를 현행 확정단가로 간주하지 않습니다."],"refs":[{"year":2018,"round":4,"subject":1,"originalNumber":5,"appNumber":5,"topic":"대추 비가림시설 가입금액·보험료","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"7"},{"year":2020,"round":6,"subject":1,"originalNumber":9,"appNumber":9,"topic":"비가림·해가림시설 가입금액","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11"}],"example":{"year":2020,"round":6,"subject":1,"originalNumber":9,"appNumber":9,"topic":"비가림·해가림시설 가입금액","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11","steps":["현행 비가림시설 가입금액은 ㎡당 시설비 × 면적 × 선택비율(80~130%, 10% 단위)로 산출한다. 포도·대추의 최소 가입면적은 200㎡이다."],"note":"정정 및 해석: 종전 3,001,000원은 천원 미만 절사값이다. 본문은 현행 천원단위에서 절사 문언에 따른 3,000,000원을 제시하고 해석 차이를 명시했다. 포도·대추 현행 원화 금액은 단가표 확인 전 미확정이다."}},{"id":"yield_common","number":17,"title":"수확감소 피해율·미보상감수량·보험금","scope":"수확감소보장 공통 / 세부 품목 예외 별도","page":147,"printedPage":140,"pdfPage":41,"formula":["미보상감수량 = (평년수확량 - 수확량) × 미보상비율","피해율 = (평년수확량 - 수확량 - 미보상감수량) ÷ 평년수확량","수확감소보험금 = 가입금액 × max(피해율 - 자기부담비율, 0)"],"terms":[["평년수확량","계약·손해평가에서 정한 정상적인 기준 수확량입니다."],["수확량","조사량과 미보상·기수확 면적 인정량 등을 반영한 수확량입니다."],["미보상비율","보상하지 않는 원인의 감소분에 적용하는 비율입니다."],["자기부담비율","보험금 계산에서 피해율로부터 공제하는 계약자 부담분입니다."]],"legacy":false,"notes":["복숭아·감자 병해충 감수량, 벼 병해충 단독사고 한도 등 품목별 예외는 별도로 반영합니다.","이미 미보상감수량이 주어졌으면 이를 다시 비율로 계산하여 중복 공제하지 않습니다."],"refs":[{"year":2015,"round":1,"subject":2,"originalNumber":9,"appNumber":19,"topic":"벼 세 보장 지급사유와 보험금","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2016,"round":2,"subject":2,"originalNumber":8,"appNumber":18,"topic":"벼 수량요소조사 방식의 변경","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2017,"round":3,"subject":1,"originalNumber":8,"appNumber":8,"topic":"벼 15%형 세 가지 보험금","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2017,"round":3,"subject":2,"originalNumber":10,"appNumber":20,"topic":"벼 유효중량·피해율·보험금","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"23"},{"year":2018,"round":4,"subject":2,"originalNumber":19,"appNumber":19,"topic":"벼 수량요소조사: 원표와 현행 비교","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2019,"round":5,"subject":1,"originalNumber":9,"appNumber":9,"topic":"복숭아 주계약·추가보장","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2019,"round":5,"subject":2,"originalNumber":18,"appNumber":18,"topic":"벼 병해충·수확감소·경작불능","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2020,"round":6,"subject":2,"originalNumber":12,"appNumber":12,"topic":"벼 재이앙·수확감소보험금","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"14"},{"year":2020,"round":6,"subject":2,"originalNumber":20,"appNumber":20,"  생존 모지수입니다."]],"legacy":false,"notes":["수정불량률 50%에서 15%를 빼면 35%이며 50%×85%가 아닙니다.","생존 모지수의 총수와 포기당 값을 섞지 않습니다."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":3,"appNumber":13,"topic":"복분자 고사결과모지수","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"15"},{"year":2023,"round":9,"subject":2,"originalNumber":20,"appNumber":20,"topic":"복분자 수정불량과 포기당 모지수","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2025,"round":11,"subject":2,"originalNumber":16,"appNumber":16,"topic":"복분자 종합위험·특정위험 과실손해","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":20,"appNumber":20,"topic":"복분자 수정불량과 포기당 모지수","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["수정불량환산계수 = 200/400 - 자연수정불량률 15% = 35%. 수정불량환산 고사결과모지수 = 5 × 35% = 1.75개/포기."],"note":"기존 “표본설계가 없어 확정 불가”를 정정했다. 살아있는 모지수·수정불량·미보상 공제부터 최종 보험금까지 완성했다."}},{"id":"raspberry_remaining","number":21,"title":"복분자 잔여수확량비율·수확감소환산","scope":"복분자 / 6월 특정위험","page":150,"printedPage":143,"pdfPage":49,"formula":["6월 1~7일 잔여수확량비율(%) = 98 - d","6월 8~20일 잔여수확량비율(%) = (d² - 43d + 460) ÷ 2","수확감소환산계수 = 잔여수확량비율 - 결실률","결실률 = 결실수 ÷ 전체개화수","수확감소환산 고사모지수 = 적용 기초 모지수 × 수확감소환산계수"],"terms":[["d","6월 사고발생일의 일 숫자입니다."],["잔여수확량비율","사고일 이후 남아 있는 수확량의 비중입니다."],["결실률","전체 개화 중 결실한 비중입니다."],["환산계수","시기별 잔여량과 실제 결실상태를 비교하는 비율입니다."],["기초 모지수","선행 종합위험 손해 유무 등에 따라 평년·생존·수정불량환산 모지수를 구분해 정하는 계산기초입니다."]],"legacy":false,"notes":["다항식 결과는 %값입니다. 54%는 배수 0.54로 사용합니다.","환산 고사모지수의 기초 모지수는 선행 종합위험 손해 유무에 따른 규정을 적용합니다.","제11회 선행 종합위험 손해가 있는 특정위험은 (생존모지수 - 수정불량환산모지수)×환산계수로 계산합니다."],"refs":[{"year":2023,"round":9,"subject":2,"originalNumber":20,"appNumber":20,"topic":"복분자 수정불량과 포기당 모지수","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2025,"round":11,"subject":2,"originalNumber":16,"appNumber":16,"topic":"복분자 종합위험·특정위험 과실손해","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":16,"appNumber":16,"topic":"복분자 종합위험·특정위험 과실손해","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["특정위험 사고일 6월 11일의 잔여수확량비율=(11²-43×11+460)/2=54%. 결실률=50/200=25%. 수확감소환산계수=54%-25%=29%."],"note":"기존 다른 품목의 결실수 산식 설명을 복분자 고사결과모지수 산식으로 교체하고 금액까지 완성."}},{"id":"fig_branch","number":22,"title":"무화과 결과지피해율","scope":"무화과 / 수확개시 이후","page":151,"printedPage":144,"pdfPage":51,"formula":["결과지피해율 = (고사결과지수 + 미고사결과지수 × 착과피해율 - 미보상고사결과지수)","                    ÷ 기준결과지수"],"terms":[["결과지","과실이 달리는 가지입니다."],["고사결과지수","죽은 것으로 확인된 결과지 개수입니다."],["미고사결과지수","살아 있지만 과실피해가 있을 수 있는 결과지 개수입니다."],["기준결과지수","분모가 되는 조사 기준 가지수입니다."]],"legacy":false,"notes":["미보상고사결과지수는 고사 가지에 포함된 부분을 빼는 항목입니다.","정상 생존 가지에 과실피해가 없으면 착과피해율은 0입니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":15,"appNumber":15,"topic":"무화과 수확 전후 피해율","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"},{"year":2022,"round":8,"subject":2,"originalNumber":20,"appNumber":20,"topic":"무화과 수확 전·후 피해율 합산","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2022,"round":8,"subject":2,"originalNumber":20,"appNumber":20,"topic":"무화과 수확 전·후 피해율 합산","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["결과지 피해율 = (고사 5 + 미고사 20 × 착과피해율 30% - 미보상고사 2)/(고사 5 + 미고사 20) = 36%. 병해충 고사 2는 전체 고사 5에 포함된 미보상 부분이다."],"note":"기존에 누락한 병해충 고사 20주, 잘못된 50% 가공용 계수, 수확후 미고사 착과피해 누락을 모두 정정하고 최종 보험금을 완성했다."}},{"id":"fig_after","number":23,"title":"무화과 수확 후 피해율·누적 피해율","scope":"무화과 / 수확 전후 연속사고","page":151,"printedPage":144,"pdfPage":53,"formula":["금차 수확후 피해율 = (1 - 기사고 피해율) × 잔여수확량비율 × 금차 결과지피해율","누적 피해율 = 기사고 피해율 + 금차 수확후 피해율"],"terms":[["기사고 피해율","이미 반영한 선행사고 손해비율입니다."],["잔여수확량비율","사고일 이후의 미수확 부분에 해당하는 비중입니다."],["금차 피해율","앞서 반영되지 않은 이번 사고의 추가 손해비율입니다."]],"legacy":false,"notes":["기사고 피해율을 먼저 빼서 중복 손해를 막습니다.","누적 피해율을 구한 다음 계약 자기부담비율을 한 번 공제합니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":15,"appNumber":15,"topic":"무화과 수확 전후 피해율","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"},{"year":2022,"round":8,"subject":2,"originalNumber":20,"appNumber":20,"topic":"무화과 수확 전·후 피해율 합산","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2022,"round":8,"subject":2,"originalNumber":20,"appNumber":20,"topic":"무화과 수확 전·후 피해율 합산","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["수확후 피해율 = (1 - 41.06%) × 78.8% × 36% × 100 = 16.7200992% → 16.72%. 합산 피해율 = 41.06% + 16.72% = 57.78%."],"note":"기존에 누락한 병해충 고사 20주, 잘못된 50% 가공용 계수, 수확후 미고사 착과피해 누락을 모두 정정하고 최종 보험금을 완성했다."}},{"id":"fig_remaining","number":24,"title":"무화과 사고일별 잔여수확량비율","scope":"무화과 / 수확 후 일자 보정","page":151,"printedPage":144,"pdfPage":55,"formula":["8월 잔여수확량비율(%) = 100 - 1.06 × d","9월 잔여수확량비율(%) = 67 - 1.13 × d","10월 잔여수확량비율(%) = 33 - 0.84 × d"],"terms":[["d","해당 월 사고일 또는 조사에서 적용하도록 정한 기준일의 일 숫자입니다."],["잔여수확량","수확 진행으로 줄어드는 보장대상 미수확량입니다."],["월별 계수","기준서의 수확진행표에서 정한 상수와 일자계수입니다."]],"legacy":false,"notes":["기준일이 수정되면 수정된 날짜에 맞는 월별 식을 고릅니다.","기출에 사용된 8·9월 식을 정리했으며 다른 월까지 외삽하지 않습니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":15,"appNumber":15,"topic":"무화과 수확 전후 피해율","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"},{"year":2022,"round":8,"subject":2,"originalNumber":20,"appNumber":20,"topic":"무화과 수확 전·후 피해율 합산","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2019,"round":5,"subject":2,"originalNumber":15,"appNumber":15,"topic":"무화과 수확 전후 피해율","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17","steps":["9월 7일 잔여수확량비율 = [67 - 1.13 × 7]% = 59.09%. 고사결과지수 = 12 + 8 = 20개, 미고사결과지수 = 정상 20개, 기준결과지수 = 40개이다."],"note":"정정 및 조건: 기존 값은 8월 이후 피해분의 조건부 계산일 뿐이다. 본문은 정상결과지의 과실도 무피해라는 전제와 수확 전 20% 우선 적용을 명시했다. 원문 그대로 유일한 현행 답이 확정되는 문항은 아니다."}},{"id":"odi_rate","number":25,"title":"오디 미보상감수결실수·피해율","scope":"오디 / 환산결실수 기준","page":152,"printedPage":145,"pdfPage":57,"formula":["미보상감수결실수 = (평년결실수 - 조사결실수) × 미보상비율","피해율 = (평년결실수 - 조사결실수 - 미보상감수결실수) ÷ 평년결실수","보험금 = 가입금액 × max(피해율 - 자기부담비율, 0)"],"terms":[["평년결실수","계약·평가에서 정한 기준 결실수 지표입니다."],["조사결실수","조사대상 및 미보상주수 보정을 거친 결실수 지표입니다."],["미보상감수결실수","비보장 원인에 해당하는 감소 결실수입니다."]],"legacy":false,"notes":["평년·조사 결실수는 같은 환산단위로 맞춥니다.","생과 총수와 결과모지 길이당 환산결실수를 직접 비교하지 않습니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["미보상감수결실수=(170-88)×20%=16.4개. 피해율=(170-88-16.4)/170=38.588235…% → 문제 지시대로 38.59%."],"note":"기존 표 정렬을 이유로 미완성으로 남긴 계산을 원본 병합 셀과 3가지 표본 기준을 확인하여 완성."}},{"id":"citrus_grade","number":26,"title":"온주밀감 등급별 과실손해 피해율","scope":"온주밀감 / 수확직전 과실손해","page":152,"printedPage":145,"pdfPage":59,"formula":["피해율 = (등급 내 피해환산수 + 등급 외 피해환산수 × 50%)","           ÷ 기준과실수 × (1 - 미보상비율)"],"terms":[["피해환산수","피해형별 과실수에 인정계수를 곱해 합한 개수입니다."],["등급 내·외","출하 규격과 기준에 따른 과실 분류입니다."],["기준과실수","동일 조사에서 분류한 전체 과실수입니다."],["등급 외 50%","등급 외 환산피해에 추가 적용하는 인정비중입니다."]],"legacy":false,"notes":["정상과실도 분모에 포함합니다.","피해인정계수와 등급 외 50%는 서로 다른 단계입니다."],"refs":[{"year":2021,"round":7,"subject":2,"originalNumber":18,"appNumber":18,"topic":"감귤 과실손해율·보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2023,"round":9,"subject":1,"originalNumber":7,"appNumber":7,"topic":"감귤 기사고 피해율과 동상해 특약","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9"},{"year":2026,"round":12,"subject":2,"originalNumber":18,"appNumber":18,"topic":"온주밀감 과실손해와 동상해","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"20"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":18,"appNumber":18,"topic":"감귤 과실손해율·보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"20","steps":["등급 내 피해환산수 = 80 × 30% + 120 × 50% + 120 × 80% + 60 × 100% = 240개.","등급 외 피해환산수 = 110 × 30% + 130 × 50% + 90 × 80% + 140 × 100% = 310개. 등급 외 인정비율 50%를 적용하면 155개이다.","피해율 = (240 + 155) ÷ 2,000 = 19.75%. 과실손해보험금 = 25,000,000 × (19.75% - 10%) = 2,437,500원."],"note":"해석 한계: 표의 등급 외 정상과실 항목은 현행 분류와 맞지 않는다. 위 금액은 명시한 해석에 따른 학습값이며 공식 2021 채점답으로 확정한 값이 아니다. 기존 정상과실까지 피해로 센 계산은 삭제했다."}},{"id":"citrus_frost","number":27,"title":"온주밀감 동상해 손해액·보험금","scope":"온주밀감 / 수확개시 이후 동상해 특약","page":152,"printedPage":145,"pdfPage":61,"formula":["동상해 손해액 = 가입금액 × (1 - 기사고피해율) × 수확기 잔존비율","                   × 동상해피해율 × (1 - 미보상비율)","자기부담금 = 가입금액 × max(자기부담비율 - 주계약피해율, 0)","보험금 = max(동상해 손해액 - 자기부담금, 0)"],"terms":[["기사고피해율","미보상 공제 전 주계약 피해율과 선행 동상해 지표입니다."],["잔존비율","수확 진행 후 남아 있는 수확량 비중입니다."],["주계약피해율","미보상비율까지 적용한 보통약관 피해율입니다."],["동상해피해율","금차 동상해 과실의 환산 손해비율입니다."]],"legacy":false,"notes":["주계약 보험금이 0원이어도 기사고피해율까지 0이 되지 않습니다.","기출 제시 잔존식과 2026 잔존식을 구분한 비교계산을 확인합니다."],"refs":[{"year":2023,"round":9,"subject":1,"originalNumber":7,"appNumber":7,"topic":"감귤 기사고 피해율과 동상해 특약","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9"},{"year":2026,"round":12,"subject":2,"originalNumber":18,"appNumber":18,"topic":"온주밀감 과실손해와 동상해","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"20"}],"example":{"year":2023,"round":9,"subject":1,"originalNumber":7,"appNumber":7,"topic":"감귤 기사고 피해율과 동상해 특약","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9","steps":["동상해 손해액 = 10,000,000 × (1 - 15%) × 70% × 45% × (1 - 10%) = 2,409,750원. 자기부담금 = |10,000,000 × min(12% - 20%, 0)| = 800,000원."],"note":"기존은 명시된 잔존식을 임의 변경하고 기사고피해율을 12%로 써서 본문·정정표가 모두 달랐다. 두 적용 방식의 값을 구분하여 하나의 값처럼 혼용하지 않았다."}},{"id":"citrus_prior","number":28,"t "딸기·시금치·부추·장미 생산비 산식","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9","steps":["C 부추 = 재배면적 × 단위면적당 보장생산비 × 피해율 × 70%. 해당 작기 가입금액의 70% 한도도 함께 적용한다."],"note":"보완: 기존 네 산식의 취지는 유지하고 시금치 10%·장미 손해정도 100%·소손해 및 한도를 보충했다."}},{"id":"production_proportion","number":47,"title":"시설작물·버섯 가입금액 부족 시 재계산","scope":"생산비보장 / 가입금액 비례조정","page":235,"printedPage":228,"pdfPage":101,"formula":["조정 보험금 = 우선 산출보험금 × 가입금액 ÷ (재배면적 × 해당 보장생산비)","장미 분모 = 재배면적 × 나무고사 보장생산비","병·배지형은 면적×단가 대신 해당 재배수량×단가 적용"],"terms":[["우선 산출보험금","품목별 기본식으로 먼저 계산한 금액입니다."],["조정 분모","해당 재배 전체의 기준 보장생산비입니다."],["가입금액","실제로 설정된 계약 보장금액입니다."]],"legacy":false,"notes":["재배면적×보장단가가 가입금액보다 큰 등 조정요건에 해당할 때 적용합니다.","생존 장미의 분모도 고사 보장생산비로 정하는 특칙을 빠뜨리지 않습니다."],"refs":[{"year":2019,"round":5,"subject":1,"originalNumber":7,"appNumber":7,"topic":"딸기·시금치·부추·장미 생산비 산식","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9"},{"year":2023,"round":9,"subject":2,"originalNumber":17,"appNumber":17,"topic":"시설 감가율과 쑥갓 보험금","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19"},{"year":2026,"round":12,"subject":2,"originalNumber":15,"appNumber":15,"topic":"장미 생산비보장보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"17"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":15,"appNumber":15,"topic":"장미 생산비보장보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"17","steps":["가입금액에 따른 비례조정의 분모는 장미의 나무고사 보장생산비를 적용: 3,000×19,000=57,000,000원.","조정 비율=39,900,000/57,000,000=70%.","생산비보장보험금=5,670,000×70%=3,969,000원."],"note":"최종값 유지. 기존 “생존 나무와 고사 나무 생산비를 합산한 보험가액”이라는 설명을 정정. 55%→60% 구간 적용 근거 보충."}},{"id":"mushroom","number":48,"title":"버섯 재배방식별 생산비보험금","scope":"원목 표고·톱밥배지 표고·느타리","page":235,"printedPage":228,"pdfPage":103,"formula":["원목 표고 보험금 = 재배원목수 × 본당 보장생산비 × 피해율","배지 표고 보험금 = 재배배지수 × 배지당 보장생산비 × 경과비율 × 피해율","느타리 균상재배 보험금 = 균상 재배면적 × ㎡당 보장생산비 × 경과비율 × 피해율"],"terms":[["원목수","버섯 재배에 쓰는 나무 토막의 수입니다."],["배지수","종균을 접종한 배지·봉 수입니다."],["균상면적","버섯을 기르는 재배상 면적입니다."],["경과비율","재배방식·품목별 생장·수확시기 보정값입니다."]],"legacy":false,"notes":["2026 준비기계수는 톱밥배지 표고 81.4%, 느타리 해당 균상형 69.7%입니다.","제7회 원문 계수 82.2%·74.5%를 유지한 예시는 비교계산으로 구분합니다."],"refs":[{"year":2021,"round":7,"subject":2,"originalNumber":17,"appNumber":17,"topic":"버섯 생산비보장보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"19"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":17,"appNumber":17,"topic":"버섯 생산비보장보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"19","steps":["원목 표고: 손해정도비율 = 20 ÷ 40 = 50%, 피해비율 = 400 ÷ 2,000 = 20%, 피해율 = 20% × 50% = 10%. 보험금 = 2,000 × 7,000 × 10% = 1,400,000원."],"note":"연도 차이: 종전 금액 3개는 원문 계수를 쓰면 맞다. 2026 계수로 치환하면 뒤의 2개는 달라지므로 비교값까지 추가했다. 모두 10만원을 초과한다."}},{"id":"greenhouse_deduct","number":49,"title":"원예시설 자기부담금과 지급보험금","scope":"농업용시설물·부대시설 / 피복재 단독사고 구분","page":238,"printedPage":231,"pdfPage":105,"formula":["일반 자기부담금 = min(max(손해액 × 10%, 30만원), 100만원)","피복재 단독 자기부담금 = min(max(손해액 × 10%, 10만원), 30만원)","보험금 = 가입금액 한도 내 (손해액 - 자기부담금)"],"terms":[["손해액","감가 등 평가를 마친 보상대상 손해금액입니다."],["피복재 단독사고","시설 구조체 등과 함께 손해를 입지 않고 피복재만 손상된 사고입니다."],["최저·최고 공제액","비율계산액에 적용하는 하한과 상한입니다."]],"legacy":false,"notes":["동일 단지·동일 사고의 적용단위를 확인합니다.","화재·재조달가액 특약 등 별도 조건은 해당 기준을 우선 적용합니다."],"refs":[{"year":2017,"round":3,"subject":1,"originalNumber":7,"appNumber":7,"topic":"원예시설 자기부담·소손해면책","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"9"},{"year":2022,"round":8,"subject":2,"originalNumber":16,"appNumber":16,"topic":"원예시설 감가상각과 피복재 공제","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2025,"round":11,"subject":2,"originalNumber":15,"appNumber":15,"topic":"원예시설 단지별 자기부담금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"}],"example":{"year":2022,"round":8,"subject":2,"originalNumber":16,"appNumber":16,"topic":"원예시설 감가상각과 피복재 공제","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["1동 구조체: 감가 후 손해액 = 3,000,000 × (1 - 8% × 2) = 2,520,000원. 자기부담금 = min(max(2,520,000 × 10%, 300,000), 1,000,000) = 300,000원. 지급액 = 2,520,000 - 300,000 = 2,220,000원."],"note":"기존의 감가를 생략한 계산을 수정했다. 원문의 손해액이라는 명칭에 있는 해석 여지는 숨기지 않고 전제를 명시했다."}},{"id":"olympic_price","number":50,"title":"올림픽평균·가격 가중평균","scope":"농업수입보장 / 기준가격·수확기가격","page":264,"printedPage":257,"pdfPage":107,"formula":["5개년 올림픽평균 = (5개년 값 합계 - 최댓값 - 최솟값) ÷ 3","품종·등급 가중평균 = 합계(가격 × 해당 비중)"],"terms":[["올림픽평균","극단값 각 하나를 제외하고 남은 값으로 계산하는 평균입니다."],["가중치","품종 면적비중이나 등급 구성비처럼 합계가 1인 비중입니다."],["농가수취비율","문제 또는 해당 가격규정에서 농가 수취분으로 환산하는 비율입니다."]],"legacy":false,"notes":["최고·최저와 같은 값이 여러 개여도 정해진 개수만 제외합니다.","현행 포도의 유통비용 차감식과 기출 제시 농가수취비율식을 같은 식으로 암기하지 않습니다."],"refs":[{"year":2017,"round":3,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 기준가격·수확기가격","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2022,"round":8,"subject":1,"originalNumber":6,"appNumber":6,"topic":"콩 수입보장: 가격조항 변경","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"},{"year":2024,"round":10,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 수입보장: 가격 조항 변경","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2022,"round":8,"subject":1,"originalNumber":6,"appNumber":6,"topic":"콩 수입보장: 가격조항 변경","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8","steps":["백태 상품·중품 연평균은 6,200·6,150·7,000·7,200·7,350원. 최고·최저를 뺀 올림픽평균 = (6,200 + 7,000 + 7,200)/3 = 6,800원. 서리태는 7,600·8,300·7,500·7,200·8,400원 → (7,600 + 8,300 + 7,500)/3 = 7,800원."],"note":"기존의 단순 5년 평균, 농가수취비율 적용 위치 및 미완성 보험금을 수정했다. 엄밀한 현행 가격 변환에는 유통비용 자료가 추가로 필요하다."}},{"id":"legacy_price","number":51,"title":"기출 제시 농가수취비율 가격 환산","scope":"과거·원문 제시 비교식 / 현행 가격 조항과 구분","page":264,"printedPage":257,"pdfPage":109,"formula":["기준가격 = 기출의 대상기간 올림픽평균 가격 × 농가수취비율","수확기가격 = 기출의 수확기 평균가격 × 농가수취비율"],"terms":[["농가수취비율","원문이 농가가 받는 몫으로 환산하도록 제시한 비율입니다."],["대상가격","품종·등급·기간을 원문이 정한 방식으로 평균한 가격입니다."],["환산가격","수취비율을 적용한 후 보험 계산에 넣는 단가입니다."]],"legacy":true,"notes":["2026 해당 포도·콩의 유통비용 차감 조항과 구분합니다.","이미 가격에 적용한 수취비율을 보험금에 한 번 더 곱하지 않습니다."],"refs":[{"year":2017,"round":3,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 기준가격·수확기가격","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2022,"round":8,"subject":1,"originalNumber":6,"appNumber":6,"topic":"콩 수입보장: 가격조항 변경","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"8"},{"year":2024,"round":10,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 수입보장: 가격 조항 변경","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11"}],"example":{"year":2024,"round":10,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 수입보장: 가격 조항 변경","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11","steps":["중품·상품 연평균 = 4,950, 5,300, 5,550, 5,200, 5,400원/kg. 최고 5,550과 최저 4,950을 뺀 평균은 (5,300 + 5,200 + 5,400)/3 = 5,300원/kg."],"note":"기존 가격 산출 및 실제수입의 가격 적용을 수정했다. 이 문항의 숫자는 “원문 가격방식 유지” 참고값이다. 엄밀한 2026 가격 재산정에는 해당 유통비용 자료가 더 필요하다."}},{"id":"grape_current_price","number":52,"title":"현행 포도 기준가격·수확기가격","scope":"포도 / 2026 가격 조항","page":277,"printedPage":270,"pdfPage":111,"formula":["기준가격 = 연도별 상품·보통품 평균가격의 올림픽평균 - 적용 유통비용","수확기가격 = 해당 수확기 상품·보통품 평균가격 - 적용 유통비용"],"terms":[["상품·보통품 평균","기준서가 정한 두 등급의 연도별 평균가격입니다."],["유통비용","농가 수취가격 환산 시 공제하도록 정한 비용입니다."],["올림픽평균","최고·최저 연도 가격을 제외한 평균입니다."]],"legacy":false,"notes":["2017·2024년 원문 수취비율 방식은 비교식입니다. 현행 유통비용이 주어지지 않으면 단일 금액을 임의 확정하지 않습니다.","가격 계산의 적용연도와 표본기간을 확인합니다."],"refs":[{"year":2017,"round":3,"subject":1,"originalNumber":9,"appNumber":9,"topic":"포도 기준가격·수확기가격","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"11"},{"year":2024,"round":10,"subject":1," 고에는 해당 정상과 계수를 추가하지 않았습니다."],"refs":[{"year":2017,"round":3,"subject":2,"originalNumber":9,"appNumber":19,"topic":"단감 연속재해 누적감수","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21~22"}],"example":{"year":2017,"round":3,"subject":2,"originalNumber":9,"appNumber":19,"topic":"단감 연속재해 누적감수","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21~22","steps":["11월 5일 가을동상해 착과구성률=(10+20×0.8+20×0.5)÷100=0.36. 10월 31일 이후의 잎 피해에는 현행 정상과 계수 0.0031×잔여일수를 추가하지 않는다. 0.36\u003c기사고 최고 0.46이므로 추가 감수는 0개."],"note":"중요 조건부 문항: 옛 상품을 현행 5종 한정으로 대응한 학습 계산이다. 적과 전 미보상 착과감소 800개는 착과감소보험금 계산에서 별도 처리하며, 후속 재해 전체에서 일률 공제하지 않는다. 가입과실수 9,000개를 기준착과수로 바꾸거나 2019년 이후 일반 적과전종합의 추가 5% 감수를 더하지 않는다."}},{"id":"fruit_remaining_deduct","number":70,"title":"적과후 남은 자기부담·누적손해비율","scope":"적과전종합위험 / 선행 착과감소 반영","page":432,"printedPage":425,"pdfPage":147,"formula":["과실손해 자기부담감수량 = max[기본 자기부담감수량 - (착과감소량 - 미보상감수량), 0]","누적감수과실수 = 보장사고별 추가 감수과실수 합계","참고 손해비율 = 누적감수과실수 ÷ 기준착과수"],"terms":[["기본 자기부담","기준수확량×선택 자기부담비율입니다."],["보상대상 착과감소","착과감소량에서 미보상분을 뺀 양입니다."],["참고 손해비율","손해 크기의 비교지표로 지급보험금 비율과 다릅니다."]],"legacy":false,"notes":["적과전 감소량을 적과후 누적에 중복 합산하지 않습니다.","남은 자기부담은 음수가 될 수 없습니다."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":7,"appNumber":17,"topic":"단감 연속재해 누적감수","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"19~20"},{"year":2017,"round":3,"subject":2,"originalNumber":9,"appNumber":19,"topic":"단감 연속재해 누적감수","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21~22"},{"year":2018,"round":4,"subject":2,"originalNumber":20,"appNumber":20,"topic":"사과 누적감수: 병해충·주수 충돌","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22~23"},{"year":2019,"round":5,"subject":2,"originalNumber":20,"appNumber":20,"topic":"단감 5종한정·과실·나무손해","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22~23"},{"year":2021,"round":7,"subject":2,"originalNumber":20,"appNumber":20,"topi 19,"topic":"매실 품종별 수확량과 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":19,"appNumber":19,"topic":"매실 품종별 수확량과 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["전체 표준수확량=천매 100×30+남고 200×35=10,000 kg. 평년수확량 12,000 kg을 표준수확량 비율로 배분한다."],"note":"기존 “자두” 제목과 미완성 풀이를 매실의 실제 표·비대지수·반올림 지시에 맞춰 정정."}},{"id":"sample_fruits","number":72,"title":"과중·착과피해조사 최소 표본과실수","scope":"품목별 과실 표본추출","page":439,"printedPage":432,"pdfPage":151,"formula":["최소 표본과실수 = max(품종 수 × 품종별 최소수, 농지 전체 최소수)","총 추출과실수 = 회차별 최소 표본과실수의 합계"],"terms":[["품종별 최소수","한 품종에 요구하는 최소 과실수입니다."],["농지 전체 최소수","품종별 기준 외 별도로 충족해야 할 전체 최소수입니다."],["조사 회차","품종·숙기 등을 고려해 실시하는 조사 차수입니다."]],"legacy":false,"notes":["과중 기출 예: 품종별 20개, 농지별 포도 30개·복숭아/자두 40개·밤/참다래 60개를 구분합니다.","품종별 최소수와 표본주별 최소수를 혼동하지 않습니다."],"refs":[{"year":2015,"round":1,"subject":2,"originalNumber":2,"appNumber":12,"topic":"복숭아 과중조사 횟수·표본 수","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"14"},{"year":2017,"round":3,"subject":2,"originalNumber":2,"appNumber":12,"topic":"과중조사 최소 표본과실수","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"14"},{"year":2024,"round":10,"subject":2,"originalNumber":11,"appNumber":11,"topic":"조사별 최소 표본과실 수","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"13"}],"example":{"year":2024,"round":10,"subject":2,"originalNumber":11,"appNumber":11,"topic":"조사별 최소 표본과실 수","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"13","steps":["① 복숭아 과중: max(품종별 20개 × 2품종, 농지당 40개) = 40개."],"note":"2026 기준 복숭아 과중 최소량을 반영했다. 기존 포도 30개, 밤 20개를 정정했다."}},{"id":"fruit_yield","number":73,"title":"착과량·사고 감수량으로 수확량 산정","scope":"복숭아·자두 등 / 과중 조사","page":439,"printedPage":432,"pdfPage":153,"formula":["착과량 = 조사 착과수 × 조사과중 + 미보상주수 × 주당 평년수확량","조사 전 사고가 없는 해당 경우: 수확량 = max(평년수확량, 착과량) - 이후 인정감수량","이미 수확한 품종의 인정량 = 해당 품종 평년수확량"],"terms":[["조사과중","표본과실의 평균 인정중량입니다."],["착과량","개수·과중과 미보상주 보정으로 계산한 중량입니다."],["인정감수량","조사 이후 보장사고의 감소수량입니다."]],"legacy":false,"notes":["조사 전 사고유무별 적용식을 선택합니다.","max식을 모든 과수에 일괄 적용하지 않습니다."],"refs":[{"year":2020,"round":6,"subject":2,"originalNumber":20,"appNumber":20,"topic":"복숭아 품종별 수확량·피해율","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2024,"round":10,"subject":2,"originalNumber":19,"appNumber":19,"topic":"복숭아 기수확 품종과 수확량","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2024,"round":10,"subject":2,"originalNumber":19,"appNumber":19,"topic":"복숭아 기수확 품종과 수확량","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["우박 감수량 = (20,000 × 60% + 6,000 × 80%) × 0.350 = 5,880kg. 착과수조사 전 사고가 없으므로 수확량 = max(25,000, 25,720) - 5,880 = 19,840kg."],"note":"기존 미완성 수확량·보험금 답을 완성했다. 미보상주수의 주당 평년수확량과 기수확 품종의 처리도 명시했다."}},{"id":"kiwi_area","number":74,"title":"참다래 표본면적·조사대상면적","scope":"참다래 / 면적당 착과수 조사","page":451,"printedPage":444,"pdfPage":155,"formula":["사다리꼴 표본면적 = (윗변 + 아랫변) × 높이 ÷ 2","총 표본면적 = 구간별 표본면적 합계","조사대상면적 = 조사대상주수 × 주간거리 × 열간거리"],"terms":[["주간거리","같은 열의 인접 나무 사이 거리입니다."],["열간거리","인접한 나무 열 사이 거리입니다."],["표본면적","착과수를 조사한 실제 구간면적입니다."]],"legacy":false,"notes":["길이를 m로 통일하여 ㎡를 구합니다.","한 곳 면적과 전체 구간 합계를 구별합니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":13,"appNumber":13,"topic":"참다래 수확량의 중간값 처리","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15"}],"example":{"year":2019,"round":5,"subject":2,"originalNumber":13,"appNumber":13,"topic":"참다래 수확량의 중간값 처리","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15","steps":["표본구간 1곳의 사다리꼴 면적 = (1.2 + 1.8) × 1.5 ÷ 2 = 2.25㎡. 8곳 합계 = 2.25 × 8 = 18㎡이다."],"note":"정정: 기존 8,686kg은 47.222…를 47로 조기에 줄여 계산한 값이다. 기본서 산식에 없는 중간 정수화 설명을 삭제했다."}},{"id":"kiwi_yield","number":75,"title":"참다래 보정과중과 수확량","scope":"참다래 / 소과 인정중량","page":453,"printedPage":446,"pdfPage":157,"formula":["보정과중 = (50g 이하 과실 무게 × 70% + 나머지 과실 무게) ÷ 총 과실수","수확량 = 조사대상면적 × 단위면적당 착과수 × 보정과중 × (1 - 피해구성률)"],"terms":[["보정과중","소과 인정계수를 반영한 평균중량입니다."],["단위면적당 착과수","표본 전체 과실수÷표본 전체 면적입니다."],["피해구성률","보장재해 손해를 인정계수로 환산한 비율입니다."]],"legacy":false,"notes":["중간 단위면적당 착과수를 임의 정수화하지 않습니다.","g/개를 kg/개로 환산합니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":13,"appNumber":13,"topic":"참다래 수확량의 중간값 처리","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15"}],"example":{"year":2019,"round":5,"subject":2,"originalNumber":13,"appNumber":13,"topic":"참다래 수확량의 중간값 처리","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15","steps":["수확량 = 5,000 × (850 ÷ 18) × 0.0528 × (1 - 30%) = 8,726.666666…kg."],"note":"정정: 기존 8,686kg은 47.222…를 47로 조기에 줄여 계산한 값이다. 기본서 산식에 없는 중간 정수화 설명을 삭제했다."}},{"id":"plum_yield","number":76,"title":"매실 비대추정지수 보정 수확량","scope":"매실 / 적기 이전 조사","page":456,"printedPage":449,"pdfPage":159,"formula":["주당 착과량 = (표본 착과무게 합계 ÷ 표본주수) × 품종별 비대추정지수","품종 수확량 = 조사대상주수 × 주당 착과량 + 미보상주수 × 주당 평년수확량"],"terms":[["비대추정지수","적정 수확일까지 자라는 중량을 추정한 품종별 배수입니다."],["표본 착과무게","표본주의 조사 과실 중량 합계입니다."],["주당 착과량","한 주의 보정 후 조사 중량입니다."]],"legacy":false,"notes":["품종·조사시점에 맞는 지수표를 적용합니다.","기출의 주당량·품종합계 반올림 순서를 따릅니다."],"refs":[{"year":2015,"round":1,"subject":2,"originalNumber":4,"appNumber":14,"topic":"인삼·매실·복분자 조사 용어","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"16"},{"year":2025,"round":11,"subject":2,"originalNumber":19,"appNumber":19,"topic":"매실 품종별 수확량과 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":19,"appNumber":19,"topic":"매실 품종별 수확량과 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["천매 표본 착과무게=20+20+30=70 kg. 주당 착과량=(70/3)×1.140=26.6 kg/주(문제의 소수 첫째 자리 반올림 적용)."],"note":"기존 “자두” 제목과 미완성 풀이를 매실의 실제 표·비대지수·반올림 지시에 맞춰 정정."}},{"id":"peach_disease","number":77,"title":"복숭아 보장 병충해감수량","scope":"복숭아 / 병충해 인정 조건","page":471,"printedPage":464,"pdfPage":161,"formula":["병충해감수량 = 보장 병충해 입은 과실무게 × 0.5","피해율 = (평년수확량 - 수확량 - 미보상감수량 + 병충해감수량) ÷ 평년수확량"],"terms":[["보장 병충해","현행 복숭아에서 별도 인정하는 세균구멍병 등 해당 보장조건입니다."],["병충해감수량","수확량에 포함된 피해과실의 추가 손해 인정중량입니다."],["과실무게","인정 대상 피해과실의 조사 중량입니다."]],"legacy":false,"notes":["복숭아순나방을 현행 보장 병충해로 자동 인정하지 않습니다.","제5회 해설은 현행 보장 병충해감수량을 0으로 계산했습니다."],"refs":[{"year":2019,"round":5,"subject":1,"originalNumber":9,"appNumber":9,"topic":"복숭아 주계약·추가보장","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11"}],"example":{"year":2019,"round":5,"subject":1,"originalNumber":9,"appNumber":9,"topic":"복숭아 주계약·추가보장","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"11","steps":["미보상감수량 = (9,000 - 4,500) × 10% = 450kg. 현행 복숭아에서 별도로 인정하는 병충해는 세균구멍병이므로 문제의 복숭아순나방 1,200kg을 보장 병충해감수량으로 추가하지 않는다."],"note":"검토: 기존 합계를 현행 산식으로 확인했다. 지급시기와 15% 선택 근거를 구체화했다."}},{"id":"odi_alloc","number":78,"title":"오디 품종별 평년결실수 배분","scope":"오디 / 품종·주수 구성","page":479,"printedPage":472,"pdfPage":163,"formula":["품종별 평년결실수 합계 = 전체 환산 평년결실수 × (품종 표준결실수 × 주수)","                                  ÷ 전체 품종 표준결실수 가중합","품종별 주당 평년결실수 = 품종별 배분합계 ÷ 품종 실제결과주수"],"terms":[["전체 환산 평년결실수","평년결실수 지표×전체 실제결과주수입니다."],["가중합","품종 표준결실수×주수를 모두 더한 기준량입니다."],["배분합계","동일 지표단위로 품종에 배분한 값입니다."]],"legacy":false,"notes":["지표와 총 배분량의 단위를 구분합니다.","품종 표준결실수가 다르면 단순 주수 비중을 쓰지 않습니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["전체 환산 평년결실수=170×(250+150)=68,000개. 품종별 표준결실수 가중합=200×250+120×150=68,000개."],"note":"기존 표 정렬을 이유로 미완성으로 남긴 계산을 원본 병합 셀과 3가지 표본 기준을 확인하여 완성."}},{"id":"odi_survey","number":79,"title":"오디 모지 길이당 결실수·전체 조사결실수","scope":"오디 / 표본 결과모지 3개","page":487,"printedPage":480,"pdfPage":165,"formula":["길이당 환산결실수 = 조사결실수 합계 ÷ (표본주수 × 주당 선정 모지수 × 모지길이)","전체 조사결실수 = 합계(품종 조사결실수 × 조사대상주수 + 품종 평년결실수 × 미보상주수)","                       ÷ 전체 실제결과주수"],"terms":[["선정 모지수","기준에 따라 표본주마다 고르는 가지 수로 기출에서는 3개입니다."],["모지길이","환산에 쓰는 조사 결과모지의 m 단위 길이입니다."],["환산결실수","길이 기준으로 변환한 결실수 지표입니다."]],"legacy":false,"notes":["분모에서 결과모지 3개를 누락하지 않습니다.","조사값과 평년 지표를 같은 환산기준으로 맞춥니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":20,"appNumber":20,"topic":"오디 평년결실수·피해율·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22","steps":["기본서에서 표본주마다 가장 긴 결과모지 3개를 선정한다. A 환산결실수=2,520/(7×3×1.2)=100개/m. B=1,200/(5×3×1.0)=80개/m."],"note":"기존 표 정렬을 이유로 미완성으로 남긴 계산을 원본 병합 셀과 3가지 표본 기준을 확인하여 완성."}},{"id":"citrus_combined","number":80,"title":"온주밀감 수확 전·직전 피해율 결합","scope":"온주밀감 / 두 조사시점 손해","page":491,"printedPage":484,"pdfPage":167,"formula":["수확전 피해율 = 수확전 인정피해과실수 ÷ 기준과실수 × (1 - 미보상비율)","최종 피해율 = [수확전 공제전 피해율 + (1 - 수확전 공제전 피해율)","                  × 수확직전 공제전 피해율] × (1 - 적용 미보상비율)"],"terms":[["공제전 피해율","미보상비율 반영 전의 손해비율입니다."],["최종 피해율","두 시점 손해를 중복 없이 결합한 비율입니다."],["적용 미보상비율","조사들에서 규정에 따라 결정한 비보장 비율입니다."]],"legacy":false,"notes":["제12회 해설은 두 조사 중 큰 값인 20%를 적용합니다.","공제 후 피해율을 결합한 뒤 중복 감액하지 않습니다."],"refs":[{"year":2026,"round":12,"subject":2,"originalNumber":18,"appNumber":18,"topic":"온주밀감 과실손해와 동상해","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"20"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":18,"appNumber":18,"topic":"온주밀감 과실손해와 동상해","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"20","steps":["주계약 최종 피해율=[30%+(1-30%)×29%]×[1-max(20%,10%)]=40.24%. 과실손해보험금=10,000,000×(40.24%-20%)=2,024,000원."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"id":"raspberry_perplant","number":81,"title":"복분자 포기당 생존 결과모지수","scope":"복분자 / 표본구간 조사","page":501,"printedPage":494,"pdfPage":169,"formula":["포기당 살아있는 모지수 = 조사 모지수 합계 ÷ (표본구간수 × 구간당 조사 포기수)"],"terms":[["표본구간수","모지수를 조사한 구간 개수입니다."],["구간당 포기수","표본포기 전후 2포기씩 포함한 총 5포기입니다."],["포기당 모지수","평년결과모지수와 단위를 맞춘 생존 모지 개수입니다."]],"legacy":false,"notes":["구간 10개를 포기 10개로 보아 나누지 않습니다.","실제 조사 합계의 범위와 구간 구성을 확인합니다."],"refs":[{"year":2023,"round":9,"subject":2,"originalNumber":20,"appNumber":20,"topic":"복분자 수정불량과 포기당 모지수","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2025,"round":11,"subject":2,"originalNumber":16,"appNumber":16,"topic":"복분자 종합위험·특정위험 과실손해","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":16,"appNumber":16,"topic":"복분자 종합위험·특정위험 과실손해","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["기본서의 종합위험 표본구간은 표본포기 전후 2포기씩 포함한 총 5포기이다. 조사 10구간의 살아있는 결과모지수=200/(10×5)=4개/포기."],"note":"기존 다른 품목의 결실수 산식 설명을 복분자 고사결과모지수 산식으로 교체하고 금액까지 완성."}},{"id":"replant_rice","number":82,"title":"벼 재이앙·재직파보험금","scope":"벼 / 실제 재이앙·재직파 완료","page":525,"printedPage":518,"pdfPage":171,"formula":["재이앙·재직파보험금 = 보험가입금액 × 25% × 면적피해율"],"terms":[["재이앙·재직파","피해를 입은 논에 모를 다시 심거나 볍씨를 다시 뿌리는 작업입니다."],["25%","상품에서 정한 고정 지급비율입니다."],["면적피해율","지급대상 피해면적을 보험가입면적으로 나눈 값입니다."]],"legacy":false,"notes":["면적피해율 10% 초과 및 실제 이행 등 지급요건을 충족해야 합니다.","두 개의 25%가 나와도 고정 지급비율과 면적피해율의 의미를 구별합니다."],"refs":[{"year":2015,"round":1,"subject":2,"originalNumber":9,"appNumber":19,"topic":"벼 세 보장 지급사유와 보험금","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2018,"round":4,"subject":2,"originalNumber":18,"appNumber":18,"topic":"벼 네 가지 조사와 보험금","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2020,"round":6,"subject":2,"originalNumber":12,"appNumber":12,"topic":" .pdf","answerPages":"20","steps":["물음 1: 조사료용 벼 최대보장비율 45%, 7월 경과비율 90%. 경작불능보험금 = 10,000,000 × 45% × 90% = 4,050,000원."],"note":"표본조사 정정표의 최종 2,169,000원은 유지했다. 전수조사의 잘못된 Loss율 및 고사면적 평년 가산을 제거해 3,360,000원을 4,047,000원으로 정정했다."}},{"id":"harvest_impossible","number":85,"title":"벼 수확불능보험금","scope":"벼 / 제현율·산지폐기 조건","page":528,"printedPage":521,"pdfPage":177,"formula":["수확불능보험금 = 보험가입금액 × 자기부담형별 수확불능 지급비율"],"terms":[["제현율","조곡에서 왕겨를 제거하여 현미로 얻는 중량 비율입니다."],["수확불능","제현율 기준 등으로 정상 출하가 불가능한 해당 보장상태입니다."],["지급비율","수확불능용 표의 정액 비율로 경작불능 표와 다릅니다."]],"legacy":false,"notes":["기출의 15%형은 57%, 20%형은 55%입니다.","경작불능 지급비율 42%·40%를 여기에 사용하지 않습니다."],"refs":[{"year":2017,"round":3,"subject":1,"originalNumber":8,"appNumber":8,"topic":"벼 15%형 세 가지 보험금","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2018,"round":4,"subject":2,"originalNumber":18,"appNumber":18,"topic":"벼 네 가지 조사와 보험금","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"}],"example":{"year":2018,"round":4,"subject":2,"originalNumber":18,"appNumber":18,"topic":"벼 네 가지 조사와 보험금","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20","steps":["④ 수확불능조사: 수확포기 여부를 확인할 수 있는 시점에 조사. 벼 조곡 제현율이 65% 미만(분질미 70% 미만)으로 정상 출하가 불가능하고 신청한 경우, 산지폐기 확인 후 20%형은 가입금액×55% 지급한다."],"note":"일반 벼 기준과 분질미 예외를 함께 적었다. ③·④의 40%·55%는 자기부담비율 20%형에 대응하는 정액 지급비율이다."}},{"id":"field_sample_area","number":86,"title":"직사각형·표본구간 면적","scope":"밭작물 표본구간·시설 바닥면적","page":540,"printedPage":533,"pdfPage":179,"formula":["직사각형 구간면적 = 표본구간 길이 × 폭","총 표본면적 = 구간별 조사면적의 합계"],"terms":[["표본구간","작물 수량·피해량을 실제로 조사하는 작은 대표 구역입니다."],["구간 수","면적 합계에 반영할 실제 조사 구간의 개수입니다."],["테","사각형 틀 등으로 표본구간을 정하는 조사도구입니다."]],"legacy":false,"notes":["cm를 m로 바꾸어 ㎡를 계산합니다.","이미 합계면적으로 제시된 값에 구간 수를 다시 곱하지 않습니다."],"refs":[{"year":2016,"round":2,"subject":1,"originalNumber":3,"appNumber":3,"topic":"원예시설 가입 거절 사유의 변경","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"5"},{"year":2016,"round":2,"subject":2,"originalNumber":5,"appNumber":15,"topic":"밭작물 표본 수확량조사 규격","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"17"},{"year":2021,"round":7,"subject":2,"originalNumber":12,"appNumber":12,"topic":"밭작물 표본구간 조사 기준","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"14"},{"year":2024,"round":10,"subject":2,"originalNumber":16,"appNumber":16,"topic":"마늘 수입보험금과 가격하락","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2026,"round":12,"subject":2,"originalNumber":12,"appNumber":12,"topic":"밭작물 표본구간 면적조사","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"14"},{"year":2026,"round":12,"subject":2,"originalNumber":14,"appNumber":14,"topic":"차의 단위면적당 수확량","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"16"},{"year":2026,"round":12,"subject":2,"originalNumber":17,"appNumber":17,"topic":"양배추의 보장방식별 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"19"}],"example":{"year":2024,"round":10,"subject":2,"originalNumber":16,"appNumber":16,"topic":"마늘 수입보험금과 가격하락","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["표본 총면적 = 5 × 1 × 2 = 10㎡. 유효중량 = 정상 18 + 80%형 10 × (1 - 80%) + 100%형 2 × 0 = 20kg."],"note":"물음 1의 반올림 결과를 뒤 계산에도 사용했다. 비대율은 현행 일반 수치로 바꾸지 않고 문제의 명시 조건 1%를 유지했다."}},{"id":"reseeding_garlic","number":87,"title":"마늘 표준출현피해율·재파종보험금","scope":"난지형 마늘 / 보통약관·조기파종 특약","page":546,"printedPage":539,"pdfPage":181,"formula":["10a당 출현주수 = 전체 출현주수 ÷ 조사면적(㎡) × 1,000","표준피해율 = (30,000 - 10a당 피해 후 식물체주수) ÷ 30,000","보통약관 재파종보험금 = 가입금액 × 35% × 표준피해율","조기파종 특약 재파종보험금 = 가입금액 × 25% × 표준피해율"],"terms":[["10a","1,000㎡를 뜻하는 면적단위입니다."],["30,000주","10a당 표준출현주수입니다."],["표준피해율","표준주수에 비해 부족해진 식물체 비중입니다."],["조기파종 특약","보통약관과 다른 보장기간·지급비율을 가진 특별약관입니다."]],"legacy":false,"notes":["품종·사고일·재파종 기한과 재파종 후 주수 조건을 확인합니다.","제10회 원문 조건 충돌에 따른 수치계산은 난지형·유효계약 가정의 참고값입니다."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":9,"appNumber":19,"topic":"마늘 재파종보험금","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"22"},{"year":2021,"round":7,"subject":1,"originalNumber":3,"appNumber":3,"topic":"마늘 재파종보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"5"},{"year":2023,"round":9,"subject":2,"originalNumber":15,"appNumber":15,"topic":"마늘 재파종·양배추 재정식","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"},{"year":2024,"round":10,"subject":1,"originalNumber":7,"appNumber":7,"topic":"마늘 재파종: 원문 조건 충돌","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9"},{"year":2025,"round":11,"subject":1,"originalNumber":7,"appNumber":7,"topic":"마늘 조기파종·재파종·경작불능","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"9"}],"example":{"year":2021,"round":7,"subject":1,"originalNumber":3,"appNumber":3,"topic":"마늘 재파종보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"5","steps":["표준 출현주수는 10a당 30,000주이다. 표준출현피해율 = (30,000 - 27,000) ÷ 30,000 = 0.10 = 10%.","재파종 후 주수는 33,000주로서 30,000주 이상이다. 33,000주를 표준 출현주수의 분모로 사용하지 않는다."],"note":"조건 해석: 한지형까지 이 결과를 일반화할 수 없다. 기존 계산값은 유지하고 현행 적용대상을 보완했다."}},{"id":"transplant_cabbage","number":88,"title":"양배추 등 재정식보험금","scope":"해당 밭작물 / 실제 재정식","page":547,"printedPage":540,"pdfPage":183,"formula":["재정식보험금 = 보험가입금액 × 20% × 면적피해율"],"terms":[["재정식","피해로 없어진 모종 등을 다시 심는 작업입니다."],["면적피해율","재정식 지급대상 피해면적÷보험가입면적입니다."],["20%","해당 보장에 정한 고정 지급비율입니다."]],"legacy":false,"notes":["면적피해율이 자기부담비율을 초과하고 실제 재정식해야 하는 등 요건을 확인합니다.","고정 지급비율에 자기부담비율을 한 번 더 빼지 않습니다."],"refs":[{"year":2019,"round":5,"subject":1,"originalNumber":8,"appNumber":8,"topic":"재이앙·재파종·재정식","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2023,"round":9,"subject":2,"originalNumber":15,"appNumber":15,"topic":"마늘 재파종·양배추 재정식","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":15,"appNumber":15,"topic":"마늘 재파종·양배추 재정식","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17","steps":["양배추 면적피해율 = 500/2,000 = 25%로 자기부담 10%를 초과하고 해당 면적을 재정식했다.","재정식보험금 = 2,000,000 × 20% × 25% = 100,000원. 지급률 20%에 이미 정해진 보장방식을 적용하므로 여기서 자기부담비율을 한 번 더 빼지 않는다."],"note":"기존의 “한지형 재파종 25%” 적용을 수정했다. 조기파종특약의 25%와 보통약관 35%를 구분했다."}},{"id":"field_yield","number":89,"title":"표본조사 전체 수확량·조사대상면적","scope":"벼·콩·마늘·감자·양배추 등 / 수확량 조사","page":551,"printedPage":544,"pdfPage":185,"formula":["조사대상면적 = 실제경작면적 - 고사면적 - 타작물·미보상면적 - 기수확면적","단위면적당 조사수확량 = 표본 인정수확량 ÷ 총 표본면적","전체 수확량 = 단위면적당 조사수확량 × 조사대상면적","                + 단위면적당 평년수확량 × (타작물·미보상면적 + 기수확면적)"],"terms":[["인정수확량","함수율·손해분류 등 품목별 보정을 마친 표본 수량입니다."],["고사면적","보장재해로 고사하여 수확량을 0으로 평가하는 면적입니다."],["단위면적당 평년수확량","평년수확량÷실제경작면적입니다."],["미보상면적","실제 조사량 대신 평년량으로 인정하는 제외면적입니다."]],"legacy":false,"notes":["고사면적에 평년수확량을 더하지 않습니다.","타작물·미보상면적과 기수확면적의 인정량을 누락하지 않습니다."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":10,"appNumber":20,"topic":"콩 농업수입감소: 유형별 계산","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"23"},{"year":2017,"round":3,"subject":2,"originalNumber":10,"appNumber":20,"topic":"벼 유효중량·피해율·보험금","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"23"},{"year":2018,"round":4,"subject":2,"originalNumber":16,"appNumber":16,"topic":"마늘 수입감소 계산과 반올림","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2020,"round":6,"subject":2,"originalNumber":17,"appNumber":17,"topic":"마늘 농업수입감소보험금","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19"},{"year":2021,"round":7,"subject":2,"originalNumber":16,"appNumber":16,"topic":"콩 농업수입감소보장 보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2022,"round":8,"subject":2,"originalNumber":14,"appNumber":14,"topic":"감자 소과·병충해 감수량","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"16"},{"year" r":17,"appNumber":17,"topic":"양배추의 보장방식별 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"19"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":17,"appNumber":17,"topic":"양배추의 보장방식별 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"19","steps":["80%형 무게 합계=10 kg, 100%형=5 kg. 표본 인정수확량=정상 0+10×20%+5×0%=2 kg. 단위수확량=2/5=0.4 kg/㎡."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"id":"garlic_growth","number":91,"title":"마늘 건조환산·비대추정 수확량","scope":"마늘 / 조사시점 보정","page":551,"printedPage":544,"pdfPage":189,"formula":["단위면적 수확량 = (표본 인정중량 ÷ 표본면적) × 비대추정지수 × 건조환산계수","문제 제시 일비대율형 지수 = 1 + 잔여일수 × 일비대율"],"terms":[["건조환산계수","수확·건조상태 차이를 보정하는 품종별 중량비율입니다."],["비대추정지수","조사 후 수확일까지 성장할 중량을 환산하는 배수입니다."],["일비대율","원문이 제시한 하루 성장비율입니다."]],"legacy":false,"notes":["제10회는 난지형 0.72와 원문 일 1%·잔여 10일 조건을 적용합니다.","현행 일반 비대추정 표값과 기출에서 명시한 지시를 구분합니다."],"refs":[{"year":2024,"round":10,"subject":2,"originalNumber":16,"appNumber":16,"topic":"마늘 수입보험금과 가격하락","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2024,"round":10,"subject":2,"originalNumber":16,"appNumber":16,"topic":"마늘 수입보험금과 가격하락","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["난지형 건조환산계수 0.72와 문제의 잔여 10일·일 1% 비대율 적용: (20/10) × (1 + 10 × 1%) × 0.72 = 1.584 → 1.6kg/㎡."],"note":"물음 1의 반올림 결과를 뒤 계산에도 사용했다. 비대율은 현행 일반 수치로 바꾸지 않고 문제의 명시 조건 1%를 유지했다."}},{"id":"corn_sample","number":92,"title":"옥수수 표본 피해수확량","scope":"옥수수 / 착립장 상·중·하 분류","page":552,"printedPage":545,"pdfPage":191,"formula":["피해환산개수 = 하 등급 개수 + 중 등급 개수 × 50%","표본 피해수확량 = 피해환산개수 × 품종별 표준중량 × 재식시기지수 × 재식밀도지수"],"terms":[["착립장","옥수수 이삭에서 낟알이 맺힌 부분의 길이입니다."],["피해환산개수","하 100%, 중 50% 손해로 환산한 개수입니다."],["표준중량","대학찰 등 품종별로 정한 개당 기준중량입니다."],["재식지수","심은 시기·밀도에 따른 보정배수입니다."]],"legacy":false,"notes":["현재 방식은 정상 수확량이 아니라 피해수확량을 먼저 구합니다.","표준중량 g를 kg로 환산하고 품종별 160g·180g 등을 구분합니다."],"refs":[{"year":2017,"round":3,"subject":2,"originalNumber":7,"appNumber":17,"topic":"옥수수 현행 손해액 방식","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"19"},{"year":2023,"round":9,"subject":2,"originalNumber":19,"appNumber":19,"topic":"옥수수 피해수확량과 손해액","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2025,"round":11,"subject":2,"originalNumber":17,"appNumber":17,"topic":"옥수수 농업수입감소","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":19,"appNumber":19,"topic":"옥수수 피해수확량과 손해액","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["피해환산개수 = 하 18 + 중 14 × 50% = 25개. 대학찰 표준중량은 160g이므로 표본 피해수확량 = 25 × 0.160 × 1 × 1 = 4kg."],"note":"기존 정정표의 피해수확량·손해액은 맞지만 보험금 16,750,000원은 산식이 잘못됐다. 손해액보다 훨씬 큰 보험금이 나오던 오류를 수정했다."}},{"id":"corn_total","number":93,"title":"옥수수 농지 피해수확량·손해액·보험금","scope":"옥수수 / 수확감소 손해액 방식","page":553,"printedPage":546,"pdfPage":193,"formula":["피해수확량 = [(표본 피해수확량 ÷ 표본면적) × 조사대상면적","                + (표준수확량 ÷ 실제경작면적) × 고사면적] × (1 - 미보상비율)","손해액 = 피해수확량 × 가입가격","보험금 = max[min(가입금액, 손해액) - 자기부담금, 0]"],"terms":[["피해수확량","수확하지 못한 것으로 인정하는 보상대상 중량입니다."],["표준수확량","해당 품목의 기준 수확량으로 평년수확량과 다를 수 있습니다."],["자기부담금","해당 계약 가입금액×선택 자기부담비율입니다."]],"legacy":false,"notes":["타작물·기수확면적은 피해수확량에 가산하지 않습니다.","원문의 옛 정상수확량 방식과 현행 손해액 방식을 혼합하지 않습니다."],"refs":[{"year":2017,"round":3,"subject":2,"originalNumber":7,"appNumber":17,"topic":"옥수수 현행 손해액 방식","answerPdf":"2017년도 제3회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"19"},{"year":2023,"round":9,"subject":2,"originalNumber":19,"appNumber":19,"topic":"옥수수 피해수확량과 손해액","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":19,"appNumber":19,"topic":"옥수수 피해수확량과 손해액","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["농지 피해수확량 = 0.25 × 7,000 + 0.25 × 500 = 1,875kg. 타작물·기수확면적은 피해수확량에 가산하지 않는다.","손해액 = 1,875 × 2,000 = 3,750,000원. 자기부담금 = 20,000,000 × 10% = 2,000,000원.","수확감소보험금 = min(20,000,000, 3,750,000) - 2,000,000 = 1,750,000원."],"note":"기존 정정표의 피해수확량·손해액은 맞지만 보험금 16,750,000원은 산식이 잘못됐다. 손해액보다 훨씬 큰 보험금이 나오던 오류를 수정했다."}},{"id":"bean_moisture","number":94,"title":"콩 표본 수량의 함수율 보정","scope":"콩 / 기준함수율 14%","page":553,"printedPage":546,"pdfPage":195,"formula":["표본 보정중량 = 표본 작물중량 × (1 - 조사함수율) ÷ (1 - 14%)"],"terms":[["조사함수율","표본작물 중 수분의 중량 비중입니다."],["기준함수율","콩의 수량 환산기준으로 14%입니다."],["보정중량","기준 함수율 상태로 환산한 중량입니다."]],"legacy":false,"notes":["벼 표본조사의 Loss율 7%를 콩에 추가하지 않습니다.","이미 유효중량이 주어졌으면 보정을 반복하지 않습니다."],"refs":[{"year":2021,"round":7,"subject":2,"originalNumber":16,"appNumber":16,"topic":"콩 농업수입감소보장 보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":16,"appNumber":16,"topic":"콩 농업수입감소보장 보험금","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["콩 기준함수율은 14%이다. 표본 중량 보정 = 2 × (1 - 22.6%) ÷ (1 - 14%) = 1.8kg. 단위면적당 수확량 = 1.8 ÷ 10 = 0.18kg/㎡."],"note":"보완: 기존 최종 값은 유지했다. 현행 계산을 기준가격과 수확기가격 중 무조건 작은 가격만 쓴다고 일반화하지 않도록 설명을 고쳤다."}},{"id":"tea_yield","number":95,"title":"차 기수확 새싹 환산·단위면적 수확량","scope":"차(茶) / 1심2엽 조사","page":553,"printedPage":546,"pdfPage":197,"formula":["기수확비율 = 기수확 새싹수 ÷ (기수확 새싹수 + 조사 수확 새싹수)","기수확분 환산무게 = 조사 새싹무게 ÷ 조사 새싹수 × 기수확 새싹수 × 기수확지수","단위면적당 수확량 = (조사무게 + 기수확분 환산무게) ÷ 총 표본면적 × 수확면적률"],"terms":[["1심2엽","한 개의 어린 싹과 두 잎으로 구성되는 조사 새싹 기준입니다."],["기수확지수","이미 수확한 새싹의 보정에 쓰는 구간별 지수입니다."],["수확면적률","가입면적 중 실제 차 수확면적 비율입니다."],["총 표본면적","A·B테와 전체 표본구간을 합친 조사면적입니다."]],"legacy":false,"notes":["제12회는 기수확비율 1/6에 대응하는 지수 0.992를 적용합니다.","A·B테 합계가 한 구간 면적인지 확인하고 구간 수를 곱합니다."],"refs":[{"year":2026,"round":12,"subject":2,"originalNumber":14,"appNumber":14,"topic":"차의 단위면적당 수확량","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"16"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":14,"appNumber":14,"topic":"차의 단위면적당 수확량","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"16","steps":["기수확비율=40/(40+200)=1/6. 10% 이상 20% 미만 구간이므로 기수확지수=0.992.","기수확분 환산무게=(20/200)×40×0.992=3.968 g → 문제의 무게 반올림 지시에 따라 4 g.","표본구간 수확량 합계=20+4=24 g.","A테·B테를 합한 한 표본구간 면적은 0.08㎡. 4구간 전체 면적=0.08×4=0.32㎡.","단위면적당 수확량=(24/0.32)×80%=60 g/㎡."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"id":"potato_disease","number":96,"title":"감자 병충해감수량과 피해율","scope":"감자 / 병해충 등급별 인정","page":554,"printedPage":547,"pdfPage":199,"formula":["표본 병충해감수량 = 병충해 괴경무게 × 손해정도비율 × 등급별 인정비율","전체 병충해감수량 = 표본 병충해감수량 ÷ 표본면적 × 조사대상면적","피해율 = (평년수확량 - 수확량 - 미보상감수량 + 병충해감수량) ÷ 평년수확량"],"terms":[["괴경","감자의 덩이줄기입니다."],["손해정도비율","손상 구간에 따라 기준표에서 정한 비율입니다."],["인정비율","해당 병해충의 등급별 보상 인정비중입니다."],["병충해감수량","조사수확량에 포함된 피해괴경의 추가 인정손해입니다."]],"legacy":false,"notes":["손해정도 구간과 병해충 인정비율을 구분합니다.","제2회는 정확한 손해정도 구간이 없어 현행 단일 수치답을 확정하지 않은 조건부 문항입니다."],"refs":[{"year":2016,"round":2,"subject":2,"originalNumber":4,"appNumber":14,"topic":"감자 가루더뎅이병 감수량","answerPdf":"2016년도 제2회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"16"},{"year":2022,"round":8,"subject":2,"originalNumber":14,"appNumber":14,"topic":"감자 소과·병충해 감수량","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"16"}],"example":{"year":2022,"round":8,"subject":2,"originalNumber":14,"appNumber":14,"topic":"감자 소과·병충해 감수량","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"16","steps":["무름병은 1급·인정비율 90%. 병충해감수량 = (4 × 40% × 90%)/10 × 2,800 = 403.2kg."],"note":"기존의 미완성 풀이를 완성했다. 타작물·미보상면적의 평년수량 인정과 병충해감수량 가산을 보였다."}},{"id":"ginseng_area","number":97,"title":"인삼 칸넓이·표본 단위수확량","scope":"인삼 / 칸 단위 조사","page":577,"printedPage":570,"pdfPage":201,"formula":["칸넓이 = (두둑폭 + 고랑폭) × 지주목 간격","표본 총면적 = 표본 칸수 × 칸넓이","표본 단위수확량 = 표본 수확무게 ÷ 표본 총면적"],"terms":[["두둑폭","인삼을 심은 두둑의 가로 너비입니다."],["고랑폭","두둑 사이 고랑의 너비입니다."],["지주목 간격","칸의 길이에 해당하는 기둥 사이 거리입니다."],["단위수확량","㎡당 수확중량으로 기준수확량과 단위를 맞춥니다."]],"legacy":false,"notes":["길이를 m로 통일해 면적 ㎡를 구합니다.","g/㎡와 kg/㎡를 직접 나누지 않습니다."],"refs":[{"year":2015,"round":1,"subject":2,"originalNumber":4,"appNumber":14,"topic":"인삼·매실·복분자 조사 용어","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"16"},{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2025,"round":11,"subject":1,"originalNumber":8,"appNumber":8,"topic":"인삼의 가입금액·부담보험료·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["표본칸 면적 = 10 × 3 × (1.5 + 0.7) = 66㎡. 표본 단위면적당 수확량 = 9.636 ÷ 66 = 0.146kg/㎡. 피해율 = (1 - 0.146 ÷ 0.73) × (350 ÷ 500) = 80% × 70% = 56%."],"note":"정정 및 전제: 시설 피해액은 기본서에 따른 평가액이며 비용은 필요·유익한 인정비용으로 보았다. 잔존물 제거비용은 2026 기본서 PDF 582쪽의 각각 적용 문언으로 계산했다. 종전의 30,000원 공제와 손해방지비용 한도 누락을 수정했다."}},{"id":"shade_month_depr","number":98,"title":"사고 시 시설 월 단위 감가·시가 손해액","scope":"인삼 해가림시설·원예시설·축사","page":579,"printedPage":572,"pdfPage":203,"formula":["누적감가율 = 경년감가율 × 경과월수 ÷ 12","잔가율 = 1 - 누적감가율","감가 후 가액·손해액 = 해당 재조달가액 × 잔가율"],"terms":[["경년감가율","재질·시설종류별 1년 감가비율입니다."],["경과월수","취득·설치부터 사고시점까지 해당 규정으로 센 월수입니다."],["잔가율","감가 후 남은 가치의 비중입니다."],["해당 재조달가액","전체 보험가액인지 피해부분 손해액인지 계산목적에 맞춰 선택합니다."]],"legacy":false,"notes":["피복재 고정감가·내용연수 후 잔가율 등 예외를 먼저 확인합니다.","가입금액의 연 단위 감가와 사고손해의 월 단위 감가를 구분합니다."],"refs":[{"year":2015,"round":1,"subject":1,"originalNumber":8,"appNumber":8,"topic":"원예시설 잔가율","answerPdf":"2015년도 제1회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"10"},{"year":2019,"round":5,"subject":2,"originalNumber":16,"appNumber":16,"topic":"인삼 해가림시설 월 감가·가입금액","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2020,"round":6,"subject":1,"originalNumber":10,"appNumber":10,"topic":"축사 보험가액과 잔가율 수정","answerPdf":"2020년 제6회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"12"},{"year":2022,"round":8,"subject":2,"originalNumber":16,"appNumber":16,"topic":"원예시설 감가상각과 피복재 공제","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2023,"round":9,"subject":2,"originalNumber":17,"appNumber":17,"topic":"시설 감가율과 쑥갓 보험금","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19"},{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2026,"round":12,"subject":2,"originalNumber":11,"appNumber":11,"topic":"농업용 시설물 감가율","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"13"},{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2019,"round":5,"subject":2,"originalNumber":16,"appNumber":16,"topic":"인삼 해가림시설 월 감가·가입금액","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["① 감가율 = 13.33% × 25/12 = 27.770833333…%. 월 감가율을 먼저 반올림하지 않는다. 재조달가액 특약은 제시되지 않아 미가입으로 풀었다."],"note":"정정 및 단위 해석: 기존 연 2년 감가·가입금액 감액을 현행 규정에 맞게 수정했다. 원단위 이하 버림을 원 미만 절사로 읽는 경우 손해액 10,487,675원·보험금 9,487,675원이며, 이를 주 계산과 섞지 않았다."}},{"id":"ginseng_rate","number":99,"title":"인삼 피해율·연속사고 보험금","scope":"인삼 / 단위면적 기준수확량","page":580,"printedPage":573,"pdfPage":205,"formula":["피해율 = [1 - (단위면적당 조사수확량 + 단위면적당 미보상감수량)","                ÷ 연근별 기준수확량] × 피해면적 ÷ 재배면적","누적 기준 보험금 = 가입금액 × max(피해율 - 자기부담비율, 0)","금차 지급보험금 = 누적 기준 보험금 - 기지급보험금"],"terms":[["기준수확량","해당 연근에 적용하는 ㎡당 정상 기준수확량입니다."],["피해면적","이번 평가 손해에 해당하는 면적입니다."],["재배면적","해당 농지 전체 보장 재배면적입니다."],["미보상감수량","비보장 원인으로 감소한 부분을 조사량에 더해 보상에서 제외하는 값입니다."]],"legacy":false,"notes":["기출에 별도 미보상량이 없으면 해당 항목은 0입니다.","이미 지급한 보험금을 다시 지급하지 않으며 음수면 추가 지급은 없습니다."],"refs":[{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2025,"round":11,"subject":1,"originalNumber":8,"appNumber":8,"topic":"인삼의 가입금액·부담보험료·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10"}],"example":{"year":2025,"round":11,"subject":1,"originalNumber":8,"appNumber":8,"topic":"인삼의 가입금액·부담보험료·보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"10","steps":["조사수확량=213 g/㎡=0.213 kg/㎡. 피해율=(1-0.213/0.71)×2,700/3,000=63%."],"note":"기존 미완성 금액 3개 완성. 계약 연근과 피해면적 보정 반영. 2026 기본서의 가액표 숫자로 문제의 제시 가액을 대체하지 않음."}},{"id":"shade_pay","number":100,"title":"인삼 해가림시설 자기부담·비례보상","scope":"인삼 해가림시설 / 시가평가 보상","page":582,"printedPage":575,"pdfPage":207,"formula":["자기부담금 = min(max(손해액 × 10%, 10만원), 100만원)","일부보험 지급액 = (손해액 - 자기부담금) × 가입금액 ÷ 보험가액","가입금액 ≥ 보험가액: 해당 한도 내 손해액 - 자기부담금"],"terms":[["일부보험","보험가입금액이 사고시점 보험가액보다 작은 계약입니다."],["보험가액","손해평가 시점의 보장대상 가치입니다."],["비례보상비율","가입금액을 보험가액으로 나눈 배수입니다."],["시가평가","감가를 반영한 현재가치를 기준으로 하는 평가입니다."]],"legacy":false,"notes":["재조달가액 특약 가입 후 실제 복구 시에는 별도 분모·조건을 적용합니다.","일부보험에서는 자기부담을 뺀 뒤 비례보상합니다. 가축 일반식의 순서를 옮기지 않습니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":16,"appNumber":16,"topic":"인삼 해가림시설 월 감가·가입금액","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["시설 자기부담금 = 5,000,000 × 10% = 500,000원(최소 100,000원·최대 1,000,000원 범위). 시설 보험금 = (5,000,000 - 500,000) × 80% = 3,600,000원. 인삼 해가림시설에는 원예시설의 화재 자기부담금 면제 조항을 옮겨 적용하지 않는다."],"note":"정정 및 전제: 시설 피해액은 기본서에 따른 평가액이며 비용은 필요·유익한 인정비용으로 보았다. 잔존물 제거비용은 2026 기본서 PDF 582쪽의 각각 적용 문언으로 계산했다. 종전의 30,000원 공제와 손해방지비용 한도 누락을 수정했다."}},{"id":"shade_costs","number":101,"title":"해가림시설 비용손해·손해방지비용 한도","scope":"인삼 해가림시설 / 부대비용","page":582,"printedPage":575,"pdfPage":209,"formula":["잔존물 제거 인정비용 = min(실제 인정비용, 손해액 × 10%)","해당 제거비용 지급액 = (인정비용 - 해당 자기부담금) × 비례보상비율","손해방지비용 = min(인정비용 × 비례보상비율, 농지별 20만원)"],"terms":[["잔존물 제거비용","사고 후 잔해의 해체·청소·상차 등 인정비용입니다."],["손해방지비용","추가 손해의 방지·경감을 위해 필요·유익하게 지출한 비용입니다."],["비례보상비율","일부보험에서 가입금액÷보험가액입니다."]],"legacy":false,"notes":["대위권 보전비용 등은 별도 표의 자기부담·한도 적용여부를 확인합니다.","인삼시설 비용처리를 가축·원예시설에 일괄 복사하지 않습니다."],"refs":[{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21"}],"example":{"year":2021,"round":7,"subject":2,"originalNumber":19,"appNumber":19,"topic":"인삼·해가림시설 및 비용손해","answerPdf":"2021년 제7회 손해평가사 2차 정답 및 해설(2026년 기본서 기준).pdf","answerPages":"21","steps":["손해방지비용은 자기부담금 없이 비례보상 후 농지별 200,000원 한도를 적용한다. min(300,000 × 80%, 200,000) = 200,000원. 대위권 보전비용 = 200,000 × 80% = 160,000원."],"note":"정정 및 전제: 시설 피해액은 기본서에 따른 평가액이며 비용은 필요·유익한 인정비용으로 보았다. 잔존물 제거비용은 2026 기본서 PDF 582쪽의 각각 적용 문언으로 계산했다. 종전의 30,000원 공제와 손해방지비용 한도 누락을 수정했다."}},{"id":"facility_alloc","number":102,"title":"원예시설 단지 자기부담금 동별 안분","scope":"동일 단지·동일 사고 / 여러 동","page":592,"printedPage":585,"pdfPage":211,"formula":["동별 자기부담금 = 단지 전체 자기부담금 × 해당 동 손해액 ÷ 단지 전체 손해액","동별 지급보험금 = 해당 동 가입금액 한도 내 (동별 손해액 - 동별 자기부담금)"],"terms":[["단지 전체 손해액","동일 적용단위에 속하는 시설 손해액 합계입니다."],["안분","전체 공제액을 각 동의 손해액 비중으로 나누는 절차입니다."],["동별 한도","각 동 계약에 설정된 가입금액 한도입니다."]],"legacy":false,"notes":["동마다 최소자기부담금을 중복 적용하지 않습니다.","피복재 단독사고 등 다른 조건은 먼저 구분합니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":15,"appNumber":15,"topic":"원예시설 단지별 자기부담금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":15,"appNumber":15,"topic":"원예시설 단지별 자기부담금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"17","steps":["자기부담금을 동별 손해액 비율로  쓰면 실제수입 9,595,600원, 피해율 57.16%, 보험금 7,432,000원이 된다. 이는 현행 과거수입형 계산값과 다르다."],"note":"정정: 기존 파일은 과거 가격 최솟값 방식으로만 계산하여 현행 답과 달랐다. 기대수입형은 기준수입 및 보험금 산식이 다르므로 이 결과를 그대로 적용하지 않는다."}},{"id":"corn_income","number":106,"title":"옥수수 수입보장 가격조건별 손해액","scope":"옥수수 / 농업수입보장","page":640,"printedPage":633,"pdfPage":219,"formula":["기준가격 ≥ 수확기가격: 손해액 = (기준가격 - 수확기가격) × (평년수확량 - 피해수확량)","                                      + 기준가격 × 피해수확량","기준가격 \u003c 수확기가격: 손해액 = 기준가격 × 피해수확량","실제수입 = 기준수입 - 손해액"],"terms":[["피해수확량","수확감소방식과 같은 방법으로 평가한 손해 중량입니다."],["가격차 손해","수확 가능한 수량에 적용하는 기준·수확기 가격 차이입니다."],["수량손해","피해수확량에 기준가격을 곱한 부분입니다."]],"legacy":false,"notes":["가격 대소관계를 먼저 나눕니다.","기대수입형에는 해당 수확기가격 상한도 먼저 적용합니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":17,"appNumber":17,"topic":"옥수수 농업수입감소","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":17,"appNumber":17,"topic":"옥수수 농업수입감소","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"19","steps":["기준가격≥수확기가격이므로 손해액=(2,000-1,500)×(3,000-270)+2,000×270=1,905,000원."],"note":"기존 주어진 표준중량 180g을 판독 불가로 남긴 계산을 완성. 가격하락·수량손실을 함께 반영."}},{"id":"cattle_disposal","number":107,"title":"소 긴급도축 손해액·이용물 처분액","scope":"소 / 긴급도축","page":660,"printedPage":653,"pdfPage":221,"formula":["손해액 = 사고시 보험가액 - 이용물 처분액 - 해당 보상금","도축장 정산서 기준 이용물 처분액 = 지육금액 × 75%"],"terms":[["보험가액","사고시점 해당 소의 평가가치입니다."],["이용물","도축 후 판매할 수 있는 고기·가죽 등입니다."],["지육금액","도축장 정산서상 해당 금액입니다."],["손해액","회수 가능한 가치를 뺀 실제 보상대상 손실입니다."]],"legacy":false,"notes":["정산서 유무에 따른 처분액 산정방법을 확인합니다.","이용물 처리의 추가 손해방지비용과 처분액을 혼동하지 않습니다."],"refs":[{"year":2023,"round":9,"subject":2,"originalNumber":16,"appNumber":16,"topic":"가축 알릴 의무 및 한우 긴급도축","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":16,"appNumber":16,"topic":"가축 알릴 의무 및 한우 긴급도축","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["보험가액 = 655 × 9,200 = 6,026,000원. 도축장 정산 지육금액의 75%가 이용물 처분액이므로 800,000 × 75% = 600,000원이다.","손해액 = 6,026,000 - 600,000 = 5,426,000원. 가입금액 6,500,000원이 보험가액보다 크므로 비례감액 없이 손해액을 기초로 한다."],"note":"기존 ② 2년·③ 5km·④ 30일을 수정했다. “기준월·환산방식 불명”으로 미완성인 보험금도 기본서 기준으로 완성했다."}},{"id":"hanwoo","number":108,"title":"한우 kg당 가격·보험가액","scope":"한우 / 7개월 이상","page":662,"printedPage":655,"pdfPage":223,"formula":["kg당 가격 = max(해당 성별 350kg 산지가격 ÷ 350, 600kg 산지가격 ÷ 600)","기본 보험가액 = 해당 월령 인정체중 × kg당 가격","보험가액 = max(기본 보험가액, 해당 송아지가격)"],"terms":[["전전월 가격","사고 월보다 두 달 전의 기준 산지가격입니다."],["인정체중","약관의 월령별 발육표준표와 상한으로 정한 체중입니다."],["kg당 가격","두 기준체중의 단가 중 높은 값입니다."],["송아지가격 하한","월령별 산출값이 더 낮을 때 적용하는 보완기준입니다."]],"legacy":false,"notes":["가격 비교는 총가격이 아니라 kg당 단가로 합니다.","월령·성별별 인정체중 상한을 확인합니다."],"refs":[{"year":2022,"round":8,"subject":2,"originalNumber":19,"appNumber":19,"topic":"한우 보험가액과 장기간 비움 면책","answerPdf":"2022년 제8회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"21"},{"year":2023,"round":9,"subject":2,"originalNumber":16,"appNumber":16,"topic":"가축 알릴 의무 및 한우 긴급도축","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18"},{"year":2024,"round":10,"subject":2,"originalNumber":12,"appNumber":12,"topic":"한우 송아지가격 및 인정체중","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"14"}],"example":{"year":2023,"round":9,"subject":2,"originalNumber":16,"appNumber":16,"topic":"가축 알릴 의무 및 한우 긴급도축","answerPdf":"2023년 제9회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"18","steps":["사고 전전월은 2023년 5월이다. kg당 가격은 max(3,220,000/350, 3,600,000/600) = max(9,200, 6,000) = 9,200원/kg.","보험가액 = 655 × 9,200 = 6,026,000원. 도축장 정산 지육금액의 75%가 이용물 처분액이므로 800,000 × 75% = 600,000원이다."],"note":"기존 ② 2년·③ 5km·④ 30일을 수정했다. “기준월·환산방식 불명”으로 미완성인 보험금도 기본서 기준으로 완성했다."}},{"id":"dairy","number":109,"title":"젖소 월령구간 보험가액 보간","scope":"젖소 암컷 / 월령별 9단계","page":663,"printedPage":656,"pdfPage":225,"formula":["8~12개월: 분유떼기 가격 + (수정단계 가격 - 분유떼기 가격) ÷ 6 × (월령 - 7)","19~23개월: 수정단계 가격 + (초산우 가격 - 수정단계 가격) ÷ 6 × (월령 - 18)","32~39개월: 초산우 가격 + (다산우 가격 - 초산우 가격) ÷ 9 × (월령 - 31)","56~66개월: 다산우 가격 + (노산우 가격 - 다산우 가격) ÷ 12 × (월령 - 55)"],"terms":[["월령","사고시점 소의 나이를 개월로 표현한 값입니다."],["분유떼기·수정단계·초산우·다산우·노산우 가격","각 생육단계에 적용하는 기준 산지가격입니다."],["보간","두 가격 단계 사이를 월령에 비례해 연결하는 계산입니다."]],"legacy":false,"notes":["1~7개월 중 어린 개체의 50% 적용과 고정가격 구간은 별도로 확인합니다.","기출의 만원 미만 절사 지시가 있는 값은 계산 마지막에 처리합니다."],"refs":[{"year":2018,"round":4,"subject":1,"originalNumber":10,"appNumber":10,"topic":"젖소 월령별 보험가액","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"12"}],"example":{"year":2018,"round":4,"subject":1,"originalNumber":10,"appNumber":10,"topic":"젖소 월령별 보험가액","answerPdf":"2018년도 제4회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"12","steps":["② 11개월: 100 + (300 - 100) ÷ 6 × (11 - 7) = 233.333333…만원 → 233만원."],"note":"문제는 보험가액을 묻는다. 보상 여부, 긴급도축 이용물처분액, 자기부담금까지 적용한 지급보험금과 구별한다. 유량검정젖소의 별도 평가는 제외했다."}},{"id":"pig_weight","number":110,"title":"비육돈·육성돈 보험가액의 체중 보간","scope":"돼지 / 체중별 평가","page":668,"printedPage":661,"pdfPage":227,"formula":["보험가액 = 자돈가격 + (적용체중 - 30) × (110kg 비육돈 수취가격 - 자돈가격) ÷ 80","110kg 비육돈 수취가격 = 기준 돈육대표가격 × 110 × 지급률"],"terms":[["자돈가격","30kg 기준 자돈의 적용가격입니다."],["적용체중","약관의 인정조건·상하한에 맞춘 kg 단위 체중입니다."],["지급률","돼지 생체중과 돈육수취액을 연결하는 비율로 해당 현행식은 76.8%입니다."],["보간","30kg와 110kg의 가격 차이를 체중에 비례해 배분하는 과정입니다."]],"legacy":false,"notes":["제11회 휴지특약 계산 예는 문제에서 지정한 95kg 평균가격 조건을 유지합니다.","휴지특약의 정의상 100kg 기준과 문제의 지정값이 다른 점을 구분합니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20","steps":["문제 지정 평균가격=150,000+(95-30)×(500,000-150,000)/80=434,375원/두."],"note":"기존 돼지·축사 미완성 금액과 휴지특약 계산 오류 정정. 2026 이익률 하한과 80% 조건부 비례보상 반영."}},{"id":"layer_egg","number":111,"title":"산란계 계란 가중평균가격·순가격","scope":"산란계 / 계란 가격","page":670,"printedPage":663,"pdfPage":229,"formula":["계란 평균가격 = 왕란가격 × 2% + 특란가격 × 53.5% + 대란 이하 가격 × 44.5%","평가용 순가격 = max(계란 평균가격 - 계란 1개 생산비, 10원)"],"terms":[["왕란·특란·대란 이하","계란 중량규격별 구분입니다."],["가중치","기준서가 정한 중량규격별 비중입니다."],["생산비","현행 표의 계란 1개당 생산비 77원입니다."],["평가용 순가격","생산비 공제와 10원 하한을 반영한 가격입니다."]],"legacy":false,"notes":["중량규격별 가격을 단순평균하지 않습니다.","현행 생산비·최저가격 조건을 함께 반영합니다."],"refs":[{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21","steps":["계란 가중평균가격=160×2%+154×53.5%+138×44.5%=147원. 생산비 공제 후=147-77=70원."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"id":"layer_bird","number":112,"title":"산란계 주령별 1마리 보험가액","scope":"산란계 / 병아리·중추·성계","page":670,"printedPage":663,"pdfPage":231,"formula":["2~9주: 병아리가격 + (산란중추가격 - 병아리가격) ÷ 9 × (주령 - 1)","10~15주: 산란중추가격","16~19주: 산란중추가격 + (20주 산란계가격 - 산란중추가격) ÷ 5 × (주령 - 15)","20~70주: (550 - 사고일령) × 70% × 평가용 계란 순가격"],"terms":[["주령","사고시점 나이를 주 단위로 표현한 값입니다."],["사고일령","사고시점 나이를 일 단위로 표현한 값입니다. 기출에서는 주령×7을 사용합니다."],["산란중추가격","어린 산란계 단계의 기준가격입니다."],["550일","산란계 가액식의 기준 생산일수입니다."]],"legacy":false,"notes":["주령과 일령을 혼동하지 않습니다.","생후 1주 이하 및 71주 이상은 별도 표의 기준가격을 적용합니다."],"refs":[{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21","steps":["30주령 1마리 가액=(550-30×7)×70%×70=16,660원. 폐사 손해=16,660×600=9,996,000원."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"id":"barn_ratio","number":113,"title":"축사 80% 조건부 실손·비례보상","scope":"축사·가금사 / 일부보험 특칙","page":673,"printedPage":666,"pdfPage":233,"formula":["가입금액 ≥ 보험가액 × 80%: 가입금액 한도 내 손해액을 보상기초로 함","가입금액 \u003c 보험가액 × 80%: 보상기초액 = 손해액 × 가입금액 ÷ (보험가액 × 80%)"],"terms":[["80% 조건","축사의 일부보험에 적용하는 실손보상 인정기준입니다."],["보험가액","사고시점 감가 후 축사 가치입니다."],["보상기초액","자기부담금 공제 전의 계약상 인정금액입니다."]],"legacy":false,"notes":["가축 일반 비례보상 분모 보험가액과 축사의 보험가액×80%를 구분합니다.","가입금액이 보험가액을 초과해도 초과이익을 보상하지 않습니다."],"refs":[{"year":2024,"round":10,"subject":2,"originalNumber":13,"appNumber":13,"topic":"축사 잔존 가입금액과 비례보상","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15"},{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2024,"round":10,"subject":2,"originalNumber":13,"appNumber":13,"topic":"축사 잔존 가입금액과 비례보상","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15","steps":["잔존 가입금액은 보험가액의 80%인 160,000,000원 미만이다. 비례보상액 = 8,000,000 × 100,000,000/(200,000,000 × 80%) = 5,000,000원."],"note":"기존의 최초 가입금액 기준 계산을 고치고 미완성 최종 보험금을 확정했다."}},{"id":"barn_deduct","number":114,"title":"축사 풍수재 등 자기부담금","scope":"축사·가금사 / 풍재·수재·설해·지진","page":674,"printedPage":667,"pdfPage":235,"formula":["자기부담금 = max(지급보험금 계산기초액 × 선택 자기부담비율, 50만원)","보험금 = max(계산기초액 - 자기부담금, 0)"],"terms":[["계산기초액","80% 조건부 실손·비례보상 등을 반영한 공제 전 금액입니다."],["선택비율","보험증권에 정한 자기부담비율입니다."],["50만원","해당 손해에 적용하는 최저 자기부담금입니다."]],"legacy":false,"notes":["선택비율 0%여도 최저 50만원이 적용될 수 있습니다.","일반 가축의 비율 자기부담과 구분합니다."],"refs":[{"year":2024,"round":10,"subject":2,"originalNumber":13,"appNumber":13,"topic":"축사 잔존 가입금액과 비례보상","answerPdf":"2024년 제10회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"15"},{"year":2025,"round":11,"subject":1,"originalNumber":10,"appNumber":10,"topic":"경주마·축사 자기부담금과 정부지원","answ 다."],["특약 가입금액","휴지위험 특약에 별도로 설정한 계약금액입니다."]],"legacy":false,"notes":["해당 특약은 자기부담금이 없습니다.","일부보험 보상비율은 돼지 본체 가입금액이 아니라 휴지특약 가입금액으로 계산합니다."],"refs":[{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"}],"example":{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20","steps":["휴지특약 보험금=2,150,156.25×20,000,000/28,668,750=1,500,000원. 자기부담금 없음. 문제의 원 단위 반올림 후에도 동일."],"note":"기존 돼지·축사 미완성 금액과 휴지특약 계산 오류 정정. 2026 이익률 하한과 80% 조건부 비례보상 반영."}},{"id":"livestock_total","number":119,"title":"가축 전체 보험가액·폐사 손해액","scope":"가축 / 축종·생육단계별 합산","page":684,"printedPage":677,"pdfPage":245,"formula":["전체 보험가액 = 합계(생육단계별 1마리 가액 × 전체 마릿수)","폐사 손해액 = 합계(생육단계별 1마리 가액 × 폐사 마릿수)"],"terms":[["1마리 가액","해당 축종·성별·월령·주령에 따른 평가금액입니다."],["전체 마릿수","같은 평가단위의 사고시점 전체 사육수량입니다."],["폐사 마릿수","보장재해로 죽은 해당 평가단위 수량입니다."]],"legacy":false,"notes":["보험가액 계산에는 전체 마릿수, 손해액 계산에는 피해 마릿수를 씁니다.","전손이면 손해액과 보험가액이 같을 수 있으나 일부손해에 일반화하지 않습니다."],"refs":[{"year":2019,"round":5,"subject":2,"originalNumber":14,"appNumber":14,"topic":"돼지 전손과 비용손해","answerPdf":"2019년도 제5회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"16"},{"year":2025,"round":11,"subject":2,"originalNumber":18,"appNumber":18,"topic":"돼지·축사·축산휴지위험 보험금","answerPdf":"2025년 제11회 손해평가사 2차 답안 및 해설(2026년 기본서 기준).pdf","answerPages":"20"},{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21"}],"example":{"year":2026,"round":12,"subject":2,"originalNumber":19,"appNumber":19,"topic":"산란계와 가금사의 보험금","answerPdf":"2026년 제12회 손해평가사 2차 답안 및 해설.pdf","answerPages":"21","steps":["손해액 합계=21,000,000원. 전체 보험가액=16,660×1,200+7,000×1,000+5,720×1,400=35,000,000원. 부보비율=28,000,000/35,000,000=80%."],"note":"기존 최종 답 유지. 계산 근거 및 해설 보충."}},{"
